name: Run Lint
description: Setup Bun, install dependencies, run lint, and emit lifecycle events

inputs:
  bun-version:
    description: Bun version to use
    default: latest
  install:
    description: Set to 'false' to skip bun setup and install (when caller already ran them)
    default: "true"
  name:
    description: Check name for the results folder (e.g. "oxlint", "typecheck")
    default: oxlint
outputs:
  lint-output:
    description: Lint output
    value: ${{ steps.run-lint.outputs.lint-output }}
  outcome:
    description: Lint outcome (success or failure)
    value: ${{ steps.run-lint.outputs.outcome }}
  summary:
    description: One-line summary of the lint results
    value: ${{ steps.run-lint.outputs.summary }}

runs:
  using: composite
  steps:
    - name: Setup Bun
      if: ${{ inputs.install != 'false' }}
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install dependencies
      if: ${{ inputs.install != 'false' }}
      shell: bash
      run: bun install --frozen-lockfile

    - name: Run lint
      id: run-lint
      shell: bash
      run: |
        bun run lint 2>&1 | tee "$RUNNER_TEMP/lint-output.txt"
        exit_code=${PIPESTATUS[0]}
        # Extract summary
        if [ $exit_code -eq 0 ]; then
          summary="No issues found"
        else
          error_count=$(grep -c 'error\|Error' "$RUNNER_TEMP/lint-output.txt" || echo "0")
          warning_count=$(grep -c 'warning\|Warning' "$RUNNER_TEMP/lint-output.txt" || echo "0")
          summary="${error_count} errors, ${warning_count} warnings"
        fi
        {
          echo "lint-output<<EOF"
          cat "$RUNNER_TEMP/lint-output.txt"
          echo "EOF"
          echo "outcome=$([ $exit_code -eq 0 ] && echo success || echo failure)"
          echo "summary=$summary"
        } >> $GITHUB_OUTPUT
        exit $exit_code

    - uses: developing-software/agents/actions/event/data@dev
      if: always()
      with:
        key: checks/lint/${{ inputs.name }}
        data: '{"outcome":"${{ steps.run-lint.outputs.outcome }}","summary":"${{ steps.run-lint.outputs.summary }}"}'
        tag: check:lint/${{ inputs.name }}:${{ steps.run-lint.outputs.outcome }}
        output: ${{ runner.temp }}/lint-output.txt

    - uses: developing-software/agents/actions/artifact/upload@dev
      if: failure()
      with:
        path: ${{ runner.temp }}/lint-output.txt
        name: lint-output.txt

    - uses: developing-software/agents/actions/event/emit@dev
      if: always()
      with:
        type: lint
        data: >-
          {"outcome":${{ toJSON(steps.run-lint.outputs.outcome) }}}
