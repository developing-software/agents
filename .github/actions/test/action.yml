name: Run Tests
description: Setup Bun, install dependencies, run tests, and emit lifecycle events

inputs:
  bun-version:
    description: Bun version to use
    default: latest
  install:
    description: Set to 'false' to skip bun setup and install (when caller already ran them)
    default: "true"
  packages:
    description: "Space-separated list of package directories to test (default: all)"
    required: false
  name:
    description: Check name for the results folder (e.g. "unit", "integration")
    default: unit
outputs:
  test-output:
    description: Test output
    value: ${{ steps.run-tests.outputs.test-output }}
  outcome:
    description: Test outcome (success or failure)
    value: ${{ steps.run-tests.outputs.outcome }}
  summary:
    description: One-line summary of the test results
    value: ${{ steps.run-tests.outputs.summary }}

runs:
  using: composite
  steps:
    - id: tests-started
      uses: developing-software/agents/actions/event/emit@dev
      with:
        type: tests.started

    - name: Setup Bun
      if: ${{ inputs.install != 'false' }}
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install dependencies
      if: ${{ inputs.install != 'false' }}
      shell: bash
      run: bun install --frozen-lockfile

    - name: Run tests
      id: run-tests
      shell: bash
      run: |
        bun run test ${{ inputs.packages }} 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
        exit_code=${PIPESTATUS[0]}
        # Extract summary from bun test output
        if [ $exit_code -eq 0 ]; then
          pass_count=$(grep -oP '\d+ pass' "$RUNNER_TEMP/test-output.txt" | head -1 | grep -oP '\d+' || echo "0")
          summary="${pass_count} tests passed"
        else
          pass_count=$(grep -oP '\d+ pass' "$RUNNER_TEMP/test-output.txt" | head -1 | grep -oP '\d+' || echo "0")
          fail_count=$(grep -oP '\d+ fail' "$RUNNER_TEMP/test-output.txt" | head -1 | grep -oP '\d+' || echo "0")
          summary="${pass_count} passed, ${fail_count} failed"
        fi
        {
          echo "test-output<<EOF"
          cat "$RUNNER_TEMP/test-output.txt"
          echo "EOF"
          echo "outcome=$([ $exit_code -eq 0 ] && echo success || echo failure)"
          echo "summary=$summary"
        } >> $GITHUB_OUTPUT
        exit $exit_code

    - uses: developing-software/agents/actions/event/data@dev
      if: always()
      with:
        key: checks/tests/${{ inputs.name }}
        data: '{"outcome":"${{ steps.run-tests.outputs.outcome }}","summary":"${{ steps.run-tests.outputs.summary }}"}'
        tag: check:tests/${{ inputs.name }}:${{ steps.run-tests.outputs.outcome }}
        output: ${{ runner.temp }}/test-output.txt

    - uses: developing-software/agents/actions/artifact/upload@dev
      if: failure()
      with:
        path: ${{ runner.temp }}/test-output.txt
        name: test-output.txt

    - uses: developing-software/agents/actions/event/emit@dev
      if: always()
      with:
        parent_event_id: ${{ steps.tests-started.outputs.event_id }}
        type: tests.completed
        data: >-
          {"outcome":${{ toJSON(steps.run-tests.outputs.outcome) }}}
