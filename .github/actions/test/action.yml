name: Run Tests
description: Setup Bun, install dependencies, and run tests for core packages

inputs:
  bun-version:
    description: Bun version to use
    default: latest
  install:
    description: Set to 'false' to skip bun setup and install (when caller already ran them)
    default: "true"
  packages:
    description: Space-separated list of package directories to test
    required: true
  agents_token:
    description: Personal access token for uploading test logs to the Agents API on failure
    required: false
  api_url:
    description: Agents API base URL
    required: false
    default: https://api.agents.developing.company/api

outputs:
  test-output:
    description: Test output
    value: ${{ steps.run-tests.outputs.test-output }}
  outcome:
    description: Test outcome (success or failure)
    value: ${{ steps.run-tests.outputs.outcome }}

runs:
  using: composite
  steps:
    - name: Setup Bun
      if: ${{ inputs.install != 'false' }}
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install dependencies
      if: ${{ inputs.install != 'false' }}
      shell: bash
      run: bun install --frozen-lockfile

    - name: Run tests
      id: run-tests
      shell: bash
      run: |
        bun test ${{ inputs.packages }} 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
        exit_code=${PIPESTATUS[0]}
        {
          echo "test-output<<EOF"
          cat "$RUNNER_TEMP/test-output.txt"
          echo "EOF"
          echo "outcome=$([ $exit_code -eq 0 ] && echo success || echo failure)"
        } >> $GITHUB_OUTPUT
        exit $exit_code

    - uses: developing-software/agents/actions/event/tag@main
      if: always()
      with:
        key: tests
        value: ${{ steps.run-tests.outputs.outcome }}

    - uses: developing-software/agents/actions/artifact/upload@main
      if: failure() && inputs.agents_token != ''
      with:
        agents_token: ${{ inputs.agents_token }}
        api_url: ${{ inputs.api_url }}
        path: ${{ runner.temp }}/test-output.txt
        name: test-output.txt
