name: Run Tests
description: Setup Bun, install dependencies, and run tests for core packages

inputs:
  bun-version:
    description: Bun version to use
    default: latest
  install:
    description: Set to 'false' to skip bun setup and install (when caller already ran them)
    default: "true"
  packages:
    description: Space-separated list of package directories to test
    default: packages/core packages/functions packages/auth

outputs:
  test-output:
    description: Test output
    value: ${{ steps.run-tests.outputs.test-output }}
  outcome:
    description: Test outcome (success or failure)
    value: ${{ steps.run-tests.outputs.outcome }}

runs:
  using: composite
  steps:
    - name: Setup Bun
      if: ${{ inputs.install != 'false' }}
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install dependencies
      if: ${{ inputs.install != 'false' }}
      shell: bash
      run: bun install --frozen-lockfile

    - name: Run tests
      id: run-tests
      shell: bash
      run: |
        bun test ${{ inputs.packages }} 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
        exit_code=${PIPESTATUS[0]}
        {
          echo "test-output<<EOF"
          cat "$RUNNER_TEMP/test-output.txt"
          echo "EOF"
          echo "outcome=$([ $exit_code -eq 0 ] && echo success || echo failure)"
        } >> $GITHUB_OUTPUT
        exit $exit_code

    - uses: ./.github/actions/write-metric
      if: always()
      with:
        key: tests
        value: ${{ steps.run-tests.outputs.outcome }}
