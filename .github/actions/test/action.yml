name: Run Tests
description: Setup Bun, install dependencies, run tests, and emit lifecycle events

inputs:
  bun-version:
    description: Bun version to use
    default: latest
  install:
    description: Set to 'false' to skip bun setup and install (when caller already ran them)
    default: "true"
  packages:
    description: "Space-separated list of package directories to test (default: all)"
    required: false
  name:
    description: Check name for the results folder (e.g. "unit", "integration")
    default: unit
  token:
    description: Personal access token for emitting events and uploading artifacts to the Agents API
    required: false
  url:
    description: Agents API base URL
    required: false
    default: https://api.agents.developing.company/api

outputs:
  test-output:
    description: Test output
    value: ${{ steps.run-tests.outputs.test-output }}
  outcome:
    description: Test outcome (success or failure)
    value: ${{ steps.run-tests.outputs.outcome }}

runs:
  using: composite
  steps:
    - id: tests-started
      uses: developing-software/agents/actions/event/emit@dev
      if: inputs.token != ''
      with:
        token: ${{ inputs.token }}
        url: ${{ inputs.url }}
        type: tests.started

    - name: Setup Bun
      if: ${{ inputs.install != 'false' }}
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install dependencies
      if: ${{ inputs.install != 'false' }}
      shell: bash
      run: bun install --frozen-lockfile

    - name: Run tests
      id: run-tests
      shell: bash
      run: |
        bun test ${{ inputs.packages }} 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
        exit_code=${PIPESTATUS[0]}
        {
          echo "test-output<<EOF"
          cat "$RUNNER_TEMP/test-output.txt"
          echo "EOF"
          echo "outcome=$([ $exit_code -eq 0 ] && echo success || echo failure)"
        } >> $GITHUB_OUTPUT
        exit $exit_code

    - name: Write test result to results folder
      if: always()
      shell: bash
      env:
        OUTCOME: ${{ steps.run-tests.outputs.outcome }}
        CHECK_NAME: ${{ inputs.name }}
      run: |
        if [ -n "${AGENTS_RESULTS_DIR:-}" ]; then
          mkdir -p "$AGENTS_RESULTS_DIR/tests/$CHECK_NAME"
          printf '{"outcome":"%s"}\n' "$OUTCOME" > "$AGENTS_RESULTS_DIR/tests/$CHECK_NAME/result.json"
          if [ -f "$RUNNER_TEMP/test-output.txt" ]; then
            cp "$RUNNER_TEMP/test-output.txt" "$AGENTS_RESULTS_DIR/tests/$CHECK_NAME/output.txt"
          fi
        fi

    - uses: developing-software/agents/actions/artifact/upload@dev
      if: failure() && inputs.token != ''
      with:
        token: ${{ inputs.token }}
        url: ${{ inputs.url }}
        path: ${{ runner.temp }}/test-output.txt
        name: test-output.txt

    - uses: developing-software/agents/actions/event/emit@dev
      if: always() && inputs.token != ''
      with:
        token: ${{ inputs.token }}
        url: ${{ inputs.url }}
        parent_event_id: ${{ steps.tests-started.outputs.event_id }}
        type: tests.completed
        data: >-
          {"outcome":${{ toJSON(steps.run-tests.outputs.outcome) }}}
