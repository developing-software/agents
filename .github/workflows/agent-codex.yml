name: "Agent → Codex"
run-name: "agent-codex/${{ github.run_id }}"

on:
  workflow_call:
    inputs:
      prompt:
        description: "Task/instructions for the agent"
        required: true
        type: string
      tags:
        description: "Tags for event linking, one per line (e.g. gh:issue:42)"
        required: false
        type: string
        default: ""
      model:
        description: "Model override"
        required: false
        type: string
      branch:
        description: "Existing branch to work on (skips branch creation)"
        required: false
        type: string
    secrets:
      AGENTS_TOKEN:
        required: true
      OPENAI_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task/instructions for the agent"
        required: true
        type: string
      tags:
        description: "Tags for event linking, one per line (e.g. gh:issue:42)"
        required: false
        type: string
        default: ""
      model:
        description: "Model override"
        required: false
        type: string
      branch:
        description: "Existing branch to work on (skips branch creation)"
        required: false
        type: string

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Pre-install before Codex runs — its sandbox disables network access
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - uses: ./actions/event/init
        with:
          type: agent
          token: ${{ secrets.AGENTS_TOKEN }}
          tags: |
            harness:codex
            ${{ inputs.tags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract issue number
        id: issue
        run: |
          ISSUE=$(echo "${{ inputs.tags }}" | grep -oP '^gh:issue:\K\d+$' || true)
          echo "number=$ISSUE" >> "$GITHUB_OUTPUT"

      - uses: ./actions/git/branch
        with:
          prefix: codex
          issue_number: ${{ steps.issue.outputs.number }}
          existing_branch: ${{ inputs.branch }}

      - uses: ./actions/comment
        with:
          phase: progress
          agent: codex

      - name: Run Codex
        id: run-codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          allow-bots: "true"
          codex-home: /tmp/codex-home
          prompt: |
            ${{ inputs.prompt }}

      - uses: ./actions/agent
        if: always()
        with:
          agent: codex
          final_message: ${{ steps.run-codex.outputs.final-message }}
          provider: openai
          status: ${{ steps.run-codex.outcome }}
        env:
          CODEX_HOME: /tmp/codex-home

      - uses: ./.github/actions/check
        if: always()
        with:
          install: "false"

      - uses: ./actions/git/commit
        if: always()
        with:
          issue_number: ${{ steps.issue.outputs.number }}

      - uses: ./actions/git/pr
        id: pr
        if: always()
        with:
          prefix: codex
          issue_number: ${{ steps.issue.outputs.number }}
          prompt: ${{ inputs.prompt }}

      - uses: ./actions/comment
        if: always()
        with:
          phase: summary
