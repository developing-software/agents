name: Codex - Implement
run-name: "codex/run-${{ github.run_id }}"

on:
  workflow_call:
    inputs:
      prompt:
        description: "Task/instructions for the agent"
        required: true
        type: string
      tags:
        description: "Comma-separated tags for event linking (e.g. gh:issue:42)"
        required: false
        type: string
        default: ""
      model:
        description: "Model override"
        required: false
        type: string
    secrets:
      AGENTS_TOKEN:
        required: true
      OPENAI_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task/instructions for the agent"
        required: true
        type: string
      tags:
        description: "Comma-separated tags (e.g. gh:issue:42)"
        required: false
        type: string
        default: ""
      model:
        description: "Model override"
        required: false
        type: string

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Pre-install before Codex runs — its sandbox disables network access
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - uses: ./actions/agent/workflow
        with:
          pr_prefix: codex
          harness: codex
          tags: ${{ inputs.tags }}
          token: ${{ secrets.AGENTS_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Codex
        id: run-codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            ${{ inputs.prompt }}

      - uses: ./actions/agent/codex
        if: always()
        with:
          final_message: ${{ steps.run-codex.outputs.final-message }}
          token: ${{ secrets.AGENTS_TOKEN }}

      - uses: ./.github/actions/lint
        with:
          install: "false"
          token: ${{ secrets.AGENTS_TOKEN }}

      - uses: ./.github/actions/typecheck
        with:
          install: "false"
          token: ${{ secrets.AGENTS_TOKEN }}

      - uses: ./.github/actions/test
        with:
          install: "false"
          token: ${{ secrets.AGENTS_TOKEN }}
