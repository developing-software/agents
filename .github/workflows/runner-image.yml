name: Runner Image

on:
  push:
    branches: [dev]
    paths:
      - "apps/runner/**"
      - "packages/core/src/events/agent/**"
      - "packages/sdk/ts/src/**"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test and build reporter
        run: |
          bun --filter runner typecheck
          bun --filter runner test
          bun run apps/runner/build.ts

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/runner
          push: true
          tags: |
            ghcr.io/developing-software/agents-runner:latest
            ghcr.io/developing-software/agents-runner:${{ github.sha }}
