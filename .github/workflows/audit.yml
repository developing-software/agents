name: Audits
run-name: "audit/${{ inputs.scope || 'all' }}/${{ github.run_id }}"

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "Specific audit scope (e.g. 'metrics'). Leave empty for all."
        required: false
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .agents/audits
          fetch-depth: 1

      - name: Build audit matrix
        id: matrix
        shell: bash
        run: |
          SCOPE="${{ inputs.scope }}"
          RESULT="[]"
          for f in .agents/audits/*.md; do
            [ -f "$f" ] || continue
            NAME=$(basename "$f" .md)
            if [ -n "$SCOPE" ] && [ "$NAME" != "$SCOPE" ]; then continue; fi
            TITLE=$(sed -n '/^---$/,/^---$/{ /^title:/{ s/^title: *//; p; } }' "$f")
            RESULT=$(echo "$RESULT" | jq -c --arg n "$NAME" --arg t "$TITLE" --arg p "$f" \
              '. + [{"name":$n,"title":$t,"prompt":$p}]')
          done
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

  audit:
    needs: setup
    if: needs.setup.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Read audit prompt
        id: prompt
        shell: bash
        run: |
          # Strip YAML frontmatter, pass body as prompt
          BODY=$(sed '1{/^---$/!q}; 1,/^---$/d' "${{ matrix.prompt }}")
          {
            echo "content<<PROMPT_DELIMITER"
            echo "$BODY"
            echo "PROMPT_DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch previous audit context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .agents/context .agents/reports
          PREV=$(gh issue list --label "audit-${{ matrix.name }}" --state all --limit 1 --json number -q '.[0].number' 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            gh issue view "$PREV" --json body -q '.body' > .agents/context/previous-audit-${{ matrix.name }}.md
          else
            echo "No previous audit available." > .agents/context/previous-audit-${{ matrix.name }}.md
          fi

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --output-format stream-json
            --verbose
            --allowedTools "Read,Write,Glob,Grep,Edit(.agents/reports/*),Bash(ls *),Bash(find *),Bash(wc *),Agent"
          show_full_output: true
          prompt: ${{ steps.prompt.outputs.content }}

      - name: Publish audit issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: .agents/reports/audit-${{ matrix.name }}.md
        run: |
          if [ ! -f "$REPORT" ]; then
            echo "::error::Report file not found at $REPORT"
            exit 1
          fi
          gh issue list --label "audit-${{ matrix.name }}" --state open --json number -q '.[].number' | while read -r num; do
            gh issue close "$num" --comment "Superseded by new audit run: ${{ github.run_id }}"
          done
          gh label create "audit-${{ matrix.name }}" --color "0e8a16" --description "Automated ${{ matrix.name }} audit" 2>/dev/null || true
          gh label create audit --color "d4c5f9" --description "Audit report" 2>/dev/null || true
          gh issue create \
            --title "${{ matrix.title }}: $(date -u +%Y-%m-%d)" \
            --body-file "$REPORT" \
            --label "audit-${{ matrix.name }},audit"

      - uses: developing-software/agents/actions/event/emit@dev
        if: always()
        with:
          token: ${{ secrets.AGENTS_TOKEN }}
          type: audit
          tags: "type:audit-${{ matrix.name }}"
          data: '{"outcome":"${{ steps.claude.outcome }}"}'
