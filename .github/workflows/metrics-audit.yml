name: Metrics Audit
run-name: "metrics-audit/${{ github.run_id }}"

on:
  schedule:
    - cron: "0 8 * * *" # Daily at 08:00 UTC
    # - cron: "0 8 * * 1" # Alternative: Monday only at 08:00 UTC
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - uses: ./actions/event/emit
        continue-on-error: true
        with:
          token: ${{ secrets.AGENTS_TOKEN }}
          type: audit.started
          origin: cron
          tags: "type:metrics-audit"
          inherit_context: "false"

      - name: Prepare report file
        run: |
          mkdir -p .agents/reports
          cat > .agents/reports/metrics-audit.md << 'EOF'
          ## Metrics Audit Report

          EOF

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --output-format stream-json
            --verbose
            --allowedTools "Read,Write,Glob,Grep,Edit(.agents/reports/*),Bash(ls *),Bash(find *),Bash(wc *),Agent"
          show_full_output: true
          prompt: |
            You are running a metrics audit of this repository.

            Your job: analyze the tag system, metric collection pipeline, and console dashboards for consistency, completeness, and improvement opportunities.

            ## Output

            The file `.agents/reports/metrics-audit.md` already exists with a header. Append your findings to it.

            IMPORTANT:
            - Do NOT create GitHub issues or PRs -- the workflow handles that.
            - Do NOT modify any source files -- this is a read-only audit.
            - Only write to `.agents/reports/metrics-audit.md`.
            - Fill in every section with real findings. No placeholders or template text.

            ## Execution Strategy

            Use subagents (Agent tool) to parallelize the audit. Each subagent should:
            - Research its assigned audit category by reading the relevant files
            - Return its findings as structured text back to you
            Then you compile all findings and write the final report to `.agents/reports/metrics-audit.md`.

            Launch these subagents in parallel:
            1. **Tag Consistency agent** -- Steps 1-5 below
            2. **Metric Completeness agent** -- Steps 6-9 below
            3. **Console Display agent** -- Steps 10-12 below
            4. **Opportunities agent** -- Steps 13-15 below

            After all subagents complete, compile their findings into the report file.

            ## Audit Protocol

            ### Step 1-5: Tag Consistency

            1. Read `packages/core/src/tag/index.ts` -- record all tag type prefixes in the Tag union and all keys in the Tags builder object.
            2. Read `actions/agent/workflow/src/start.ts` -- record every tag constructed in the contextTags array (around line 48-57).
            3. Read `packages/core/src/github/webhook/handlers.ts` -- record all tags applied to webhook events (issues, PRs, pushes).
            4. Read `packages/console/src/lib/tag/tag-helpers.ts` -- record which prefixes have custom styling in `tagCategoryStyle()`, which are in `KNOWN_PREFIXES`, and which extractors exist.
            5. Cross-reference steps 1-4:
               - Tags produced in code but missing from the Tag type union?
               - Tag prefixes with no styling in `tagCategoryStyle()`?
               - Tag prefixes in `KNOWN_PREFIXES` but missing an extractor (or vice versa)?
               - Builder keys in `Tags` that don't match any produced tag?

            ### Step 6-9: Metric Completeness

            6. Read `packages/console/src/lib/events/event-helpers.ts` -- record all fields in the `EventMetrics` type and the `extractMetrics()` function.
            7. Read each agent action's metric capture files under `actions/agent/claude/`, `actions/agent/codex/`, `actions/agent/opencode/` -- record which metric fields each harness emits in its `agent.result` event data.
            8. Read `packages/console/src/lib/events/events.remote.ts` -- record the `METRIC_KEYS` arrays in `getEventSummary()` and `getAgentComparison()`, and which event types each query filters on (`agent.completed` vs `agent.result`).
            9. Cross-reference steps 6-8:
               - Metrics emitted by harnesses but not in `METRIC_KEYS` or `EventMetrics`?
               - Metrics in the type definition but never actually emitted?
               - Differences between what each harness emits?
               - Queries filtering on wrong or incomplete event types?

            ### Step 10-12: Console Display Gaps

            10. Use Glob to find all `+page.svelte` files under `packages/console/src/routes/gh/[organization]/[repo]/`. For each page, briefly note what data it displays and what data sources it uses.
            11. Read these key dashboard components and note what metrics they surface:
                - `packages/console/src/lib/events/EventOverview.svelte` -- stat cards
                - `packages/console/src/lib/events/EventAgentsOverview.svelte` -- agent comparison
                - `packages/console/src/routes/gh/[organization]/[repo]/agents/+page.svelte` -- agent runs table
            12. Read `actions/agent/workflow/src/finish.ts` -- record ALL fields in the `agent.completed` event data payload (around line 278-292). Compare against what the console actually displays. List every field that is collected but never shown in any UI.

            ### Step 13-15: Opportunities

            13. Read `packages/core/src/events/types.ts` -- record all `OriginType` values. Which ones have no events using them in the system?
            14. Read `packages/core/src/events/index.ts` -- check the `Event.list()` and `Event.listTree()` signatures. Is time-range filtering (date from/to) supported? If not, flag it.
            15. Grep all files you've examined for `TODO`, `FIXME`, or `HACK` comments.

            ## Known Gaps Seed List

            These are previously identified gaps. Verify whether each still exists and include your findings in the report:
            - `model:` tag is used in `start.ts` but may not be in the `Tag` type union or `tagCategoryStyle()`
            - `type:` and `harness:` prefixes may lack custom styling in `tagCategoryStyle()`
            - No interactive tag picker/selector in the console UI
            - No time-range filtering on any event query
            - `EventOverview` shows 4 cards (Runs, Avg Duration, Total Cost, Pass Rate) but not total tokens
            - `linesAdded`/`linesRemoved` from `agent.completed` not displayed anywhere in the console
            - `origin: "cron"` exists in `OriginType` but may have no events using it
            - Plan 05 (`.agents/plans/05-metrics-dashboard.md`) describes a metrics dashboard page that may not be implemented yet
            - No cost-over-time or token-over-time trending view
            - No per-model cost breakdown

            ## Report Format

            Write `.agents/reports/metrics-audit.md` with these sections. Fill every section with real findings -- no placeholders.

            - **Summary** -- Total findings count, severity breakdown (critical / improvement / suggestion).
            - **Tag System > Inconsistencies Found** -- Each: what, file:line, suggested fix.
            - **Tag System > OK** -- What checked out fine.
            - **Metric Completeness > Gaps Found** -- Each: description, affected harnesses, suggested fix.
            - **Metric Completeness > OK** -- What is consistent.
            - **Console Display > Missing from UI** -- Collected data not shown. Include source file and which component could display it.
            - **Console Display > Improvement Opportunities** -- New stat cards, pages, filters, dashboards.
            - **New Metric Opportunities** -- Ordered by impact. What metric, how to derive from existing events, where to display.
            - **Recommended Actions** -- Prioritized, each actionable as a standalone issue.

      - name: Verify report exists
        if: success()
        run: |
          if [ ! -f .agents/reports/metrics-audit.md ]; then
            echo "::error::Report file not found at .agents/reports/metrics-audit.md"
            exit 1
          fi
          echo "Report generated ($(wc -l < .agents/reports/metrics-audit.md) lines)"

      - name: Close previous audit issues
        if: success()
        run: |
          gh issue list --label metrics-audit --state open --json number -q '.[].number' | while read -r num; do
            gh issue close "$num" --comment "Superseded by new audit run: ${{ github.run_id }}"
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Ensure labels exist
        if: success()
        run: |
          gh label create metrics-audit --color "0e8a16" --description "Automated metrics audit" 2>/dev/null || true
          gh label create audit --color "d4c5f9" --description "Audit report" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create audit issue
        if: success()
        run: |
          gh issue create \
            --title "Metrics Audit: $(date -u +%Y-%m-%d)" \
            --body-file .agents/reports/metrics-audit.md \
            --label "metrics-audit,audit"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: ./actions/event/emit
        if: always()
        continue-on-error: true
        with:
          token: ${{ secrets.AGENTS_TOKEN }}
          type: audit.completed
          origin: cron
          tags: "type:metrics-audit"
          data: '{"outcome":"${{ steps.claude.outcome }}"}'
          inherit_context: "false"
