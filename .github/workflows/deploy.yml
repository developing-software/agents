name: Deploy
run-name: "${{ github.event.action == 'closed' && 'Remove' || 'Deploy' }} ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}"

on:
  push:
    branches:
      - prod
      - dev
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - dev

concurrency:
  group: alchemy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}

# Alchemy Cloudflare stack (infra/alchemy/cf). CI=true makes it read auth from env, not a profile.
env:
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  CI: "true"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
  PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
  PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
  PLANETSCALE_ORGANIZATION: andrebrandao
  SESSION_SECRET: ${{ secrets.APP_SESSION_SECRET }}
  GITHUB_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
  GITHUB_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  AUTH_PROVIDERS: ${{ vars.AUTH_PROVIDERS }}

jobs:
  # `env` is not available in a job `if`, so the guards read `github` directly.
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - uses: oven-sh/setup-bun@v2

      # drizzle-kit needs node:sqlite, which Bun does not provide.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: deps
        run: bun install --frozen-lockfile

      - name: Deploy
        working-directory: infra/alchemy
        run: bun alchemy deploy cf/alchemy.run.ts --stage "$STAGE" --yes

      - name: Comment preview
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Mirrors host() in infra/alchemy/cf/stage.ts for a pr-* stage.
            const stage = process.env.STAGE;
            const rows = ['dashboard', 'api', 'auth', 'mcp'].map(
              (name) => `| \`${name}\` | https://${name}.${stage}.dev.agents.v2.developing.company |`,
            );
            const body = [
              '<!-- deploy:alchemy -->',
              '## Alchemy preview deployed',
              '',
              `**Stage:** \`${stage}\``,
              '',
              '| Worker | URL |',
              '| --- | --- |',
              ...rows,
            ].join('\n');
            await require('./.github/comment.cjs')({ github, context, body });

  # Only a closed PR reaches this job, so STAGE is always `pr-<number>` — never prod/dev.
  remove:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: deps
        run: bun install --frozen-lockfile

      - name: Remove
        working-directory: infra/alchemy
        run: bun alchemy destroy cf/alchemy.run.ts --stage "$STAGE" --yes

      - name: Comment removed
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const stage = process.env.STAGE;
            const body = [
              '<!-- deploy:alchemy -->',
              '## ⚠️ Preview environment removed',
              '',
              `The Alchemy stage \`${stage}\` was torn down because this PR was merged or closed.`,
              '',
              'If anything is left over, remove it manually:',
              '',
              '```sh',
              `cd infra/alchemy && bun alchemy destroy cf/alchemy.run.ts --stage ${stage}`,
              '```',
            ].join('\n');
            await require('./.github/comment.cjs')({ github, context, body });

  # ---------------------------------------------------------------------------
  # OpenTofu target (infra/terraform). Commented out on purpose: it deploys the
  # same app to the same Cloudflare account as the Alchemy jobs above, and running
  # both on one event means two systems reconciling one set of resources.
  #
  # Uncomment only once you have decided which path owns a deploy. They do not
  # collide on hostnames (infra/terraform lives under `tf.`) nor on
  # account-scoped names (var.project defaults to "template-tf"), so they CAN
  # coexist — but they should not both run unattended off the same push.
  #
  # Needs a shared backend: uncomment the `backend "s3"` block in
  # infra/terraform/envs/cloudflare/versions.tf. With local state the runner
  # starts empty every run, so `remove` finds nothing and the environment leaks.
