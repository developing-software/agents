name: Deploy
run-name: "${{ github.event.action == 'closed' && 'Remove' || 'Deploy' }} ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}"

on:
  push:
    branches:
      - prod
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - dev

concurrency:
  group: sst-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/cache@v5
        with:
          path: |
            .sst
          key: ${{ runner.os }}-sst

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: deps
        run: bun install --frozen-lockfile

      - uses: developing-software/agents/actions/event/init@dev
        with:
          token: ${{ secrets.AGENTS_TOKEN }}
          type: deploy
          tags: |
            env:${{ env.STAGE }}
            tool:sst
            ${{ github.event_name == 'pull_request' && format('gh:pr:{0}', github.event.pull_request.number) || '' }}
            ${{ github.event_name == 'pull_request' && format('gh:branch:{0}', github.event.pull_request.head.ref) || '' }}
            ${{ github.event_name == 'pull_request' && format('gh:base:{0}', github.event.pull_request.base.ref) || '' }}
          data: >-
            {"stage":"${{ env.STAGE }}","tool":"sst"}

      - name: Attach PR data
        if: github.event_name == 'pull_request'
        uses: developing-software/agents/actions/event/data@dev
        with:
          key: pr
          data: |
            {
              "number": ${{ github.event.pull_request.number }},
              "title": ${{ toJSON(github.event.pull_request.title) }},
              "author": "${{ github.event.pull_request.user.login }}",
              "headRef": "${{ github.event.pull_request.head.ref }}",
              "baseRef": "${{ github.event.pull_request.base.ref }}",
              "headSha": "${{ github.event.pull_request.head.sha }}",
              "url": "${{ github.event.pull_request.html_url }}"
            }

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
        run: |
          bunx sst install
          bunx sst deploy --stage=${{ env.STAGE }}

      - name: Capture deploy outputs
        if: success()
        run: |
          if [ -f .sst/outputs.json ]; then
            mkdir -p "$DEV_AGENTS_RESULTS_DIR/outputs"
            cp .sst/outputs.json "$DEV_AGENTS_RESULTS_DIR/outputs/data.json"
          fi

      - name: Comment preview
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const outputs = fs.existsSync('.sst/outputs.json')
              ? JSON.parse(fs.readFileSync('.sst/outputs.json', 'utf8'))
              : {};
            const rows = Object.entries(outputs)
              .filter(([, v]) => typeof v === 'string' && v)
              .map(([k, v]) => `| \`${k}\` | ${/^https?:\/\//.test(v) ? v : `https://${v}`} |`);
            const body = [
              '<!-- deploy:sst -->',
              '## SST preview deployed',
              '',
              `**Stage:** \`${process.env.STAGE}\``,
              '',
              ...(rows.length ? ['| Output | URL |', '| --- | --- |', ...rows] : ['_No outputs captured._']),
            ].join('\n');
            await require('./.github/comment.cjs')({ github, context, body });

  # Only ever removes ephemeral `pr-<number>` stages — never prod/dev.
  remove:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: deps
        run: bun install --frozen-lockfile

      - uses: developing-software/agents/actions/event/init@dev
        with:
          token: ${{ secrets.AGENTS_TOKEN }}
          type: deploy.remove
          tags: |
            env:${{ env.STAGE }}
            tool:sst
            gh:branch:${{ github.event.pull_request.head.ref }}
            gh:base:${{ github.event.pull_request.base.ref }}
          data: >-
            {"stage":"${{ env.STAGE }}","tool":"sst"}

      - name: Attach PR data
        uses: developing-software/agents/actions/event/data@dev
        with:
          key: pr
          data: |
            {
              "number": ${{ github.event.pull_request.number }},
              "title": ${{ toJSON(github.event.pull_request.title) }},
              "author": "${{ github.event.pull_request.user.login }}",
              "headRef": "${{ github.event.pull_request.head.ref }}",
              "baseRef": "${{ github.event.pull_request.base.ref }}",
              "headSha": "${{ github.event.pull_request.head.sha }}",
              "url": "${{ github.event.pull_request.html_url }}"
            }

      - name: Remove
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
        run: |
          bunx sst install
          bunx sst remove --stage=${{ env.STAGE }}

      - name: Comment removed
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const stage = process.env.STAGE;
            const body = [
              '<!-- deploy:sst -->',
              '## ⚠️ Preview environment removed',
              '',
              `The SST stage \`${stage}\` was torn down because this PR was merged or closed.`,
              '',
              'If anything is left over, remove it manually:',
              '',
              '```sh',
              `bunx sst remove --stage=${stage}`,
              '```',
            ].join('\n');
            await require('./.github/comment.cjs')({ github, context, body });
