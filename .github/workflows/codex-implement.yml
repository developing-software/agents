name: Codex - Implement Issue
run-name: "codex/issue-${{ github.event.issue.number }}-${{ github.run_id }}"

on:
  issues:
    types: [labeled]

concurrency:
  group: codex-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.label.name == 'codex'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Pre-install before Codex runs — its sandbox disables network access
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - uses: ./actions/agents/workflow
        with:
          pr_prefix: codex
          harness: codex
          token: ${{ secrets.AGENTS_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Codex
        id: run-codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Implement the following GitHub issue in this repository:

            Title: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            Make the necessary code changes to implement this feature or fix.
            Follow the existing code style, naming conventions, and patterns in the codebase.
            Refer to AGENTS.md for project structure and guidelines.
            Do NOT commit, push, or open a pull request — only modify the files.

      - uses: ./actions/agent/codex
        if: always()
        with:
          final_message: ${{ steps.run-codex.outputs.final-message }}
          token: ${{ secrets.AGENTS_TOKEN }}

      - uses: ./.github/actions/test
        with:
          install: "false"
          token: ${{ secrets.AGENTS_TOKEN }}
