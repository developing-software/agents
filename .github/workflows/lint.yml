name: Lint
run-name: "${{ github.event_name == 'pull_request' && format('lint/pr-{0}', github.event.pull_request.number) || format('lint/sha-{0}', github.sha) }}"

on:
  push:
    branches: [dev, prod]
  pull_request:

concurrency:
  group: ${{ format('lint-{0}', github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run lint
        id: run-lint
        uses: ./.github/actions/lint
        with:
          token: ${{ secrets.AGENTS_TOKEN }}

      - name: Write summary
        if: always()
        run: |
          STATUS="${{ steps.run-lint.outputs.outcome }}"
          if [ "$STATUS" == "success" ]; then
            echo "## Lint Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Lint Failed" >> $GITHUB_STEP_SUMMARY
          fi
          {
            echo ""
            echo "<details><summary>Lint output</summary>"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/lint-output.txt"
            echo '```'
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY

      - name: Fail if lint failed
        if: steps.run-lint.outputs.outcome == 'failure'
        run: exit 1
