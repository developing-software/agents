name: Typecheck
run-name: "${{ github.event_name == 'pull_request' && format('typecheck/pr-{0}', github.event.pull_request.number) || format('typecheck/sha-{0}', github.sha) }}"

on:
  push:
    branches: [dev, prod]
  pull_request:

concurrency:
  group: ${{ format('typecheck-{0}', github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
  cancel-in-progress: false

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run typecheck
        id: run-typecheck
        uses: ./.github/actions/typecheck
        with:
          token: ${{ secrets.AGENTS_TOKEN }}

      - name: Write summary
        if: always()
        run: |
          STATUS="${{ steps.run-typecheck.outputs.outcome }}"
          if [ "$STATUS" == "success" ]; then
            echo "## Typecheck Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Typecheck Failed" >> $GITHUB_STEP_SUMMARY
          fi
          {
            echo ""
            echo "<details><summary>Typecheck output</summary>"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/typecheck-output.txt"
            echo '```'
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY

      - name: Fail if typecheck failed
        if: steps.run-typecheck.outputs.outcome == 'failure'
        run: exit 1
