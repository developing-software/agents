name: CI
run-name: "${{ github.event_name == 'pull_request' && format('ci/pr-{0}', github.event.pull_request.number) || format('ci/sha-{0}', github.sha) }}"

on:
  push:
    branches: [dev, prod]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test:ci
      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: "**/junit.xml"
          check_name: Test report
          include_passed: true
      - name: Coverage summary
        if: always()
        run: bun scripts/coverage.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: |
            **/junit.xml
            **/coverage/lcov.info
          if-no-files-found: warn

  fallow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: fallow-rs/fallow@v3
        with:
          format: sarif
          comment: true
          review-comments: true
          review-guidance: true
          max-annotations: 100
          score: true
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: fallow-results.sarif
          category: fallow

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy scan (SARIF report, all severities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      - name: Trivy gate (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table
          skip-setup-trivy: true

  report:
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, fallow, trivy]
    if: always()
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # Teardown posts the `checks` event the console Health page reads.
      - uses: ./actions/event/init
        with:
          type: checks
          token: ${{ secrets.AGENTS_TOKEN }}

      - name: Record check results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          for pair in typecheck:typecheck/tsc lint:lint/oxlint test:tests/unit fallow:fallow/fallow trivy:trivy/trivy; do
            job="${pair%%:*}"
            key="${pair#*:}"
            outcome=$(jq -r --arg j "$job" '.[$j].result' <<< "$NEEDS")
            mkdir -p "$DEV_AGENTS_RESULTS_DIR/checks/$key"
            echo "{\"outcome\":\"$outcome\",\"summary\":null}" > "$DEV_AGENTS_RESULTS_DIR/checks/$key/data.json"
            tag="check:$key:$outcome"
            echo "$tag" > "$DEV_AGENTS_TAGS_DIR/$(echo "$tag" | sed 's/[:/]/-/g')"
          done

      - name: Summarize results
        uses: actions/github-script@v7
        with:
          script: |
            // The needs context has no timing, so read per-job durations from the run's jobs API.
            const res = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            const jobs = res.data.jobs.filter((j) => j.name !== context.job);
            const dur = (s, e) => {
              const secs = Math.round((Date.parse(e) - Date.parse(s)) / 1000);
              return `${Math.floor(secs / 60)}m ${secs % 60}s`;
            };
            const icon = (c) => ({ success: "✅", skipped: "⏭️", cancelled: "🚫" })[c] ?? "❌";
            const done = jobs.filter((j) => j.started_at && j.completed_at);
            const total = done.length
              ? Math.round(
                  (Math.max(...done.map((j) => Date.parse(j.completed_at))) -
                    Math.min(...done.map((j) => Date.parse(j.started_at)))) / 1000,
                )
              : 0;
            const fail = jobs.some((j) => j.conclusion !== "success" && j.conclusion !== "skipped");
            const rows = jobs.map((j) => [
              j.name,
              `${icon(j.conclusion)} ${j.conclusion ?? "running"}`,
              j.started_at && j.completed_at ? dur(j.started_at, j.completed_at) : "—",
            ]);
            const time = `**Total:** ${Math.floor(total / 60)}m ${total % 60}s`;
            core.summary
              .addHeading("CI summary", 2)
              .addTable([
                ["Job", "Result", "Duration"].map((data) => ({ data, header: true })),
                ...rows,
              ])
              .addRaw(time);
            if (fail) core.summary.addRaw("\n\n> One or more jobs failed.");
            await core.summary.write();
            if (context.eventName === "pull_request") {
              const body = [
                "<!-- ci:summary -->",
                "## CI summary",
                "",
                "| Job | Result | Duration |",
                "| --- | --- | --- |",
                ...rows.map((r) => `| ${r.join(" | ")} |`),
                "",
                time,
                ...(fail
                  ? ["", `> One or more jobs failed. [View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`]
                  : []),
              ].join("\n");
              await require("./.github/comment.cjs")({ github, context, body });
            }
            // Last: setFailed doesn't stop the script, but the comment should post regardless.
            if (fail) core.setFailed("One or more jobs failed.");
