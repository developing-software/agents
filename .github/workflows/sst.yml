name: Deploy SST
run-name: "Deploy SST${{ github.event_name == 'pull_request' && format(' #{0}', github.event.pull_request.number) || '' }}"

on:
  workflow_dispatch:
  push:
    branches:
      # - dev
      - prod
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev
      - prod

concurrency:
  group: ${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - uses: actions/cache@v5
        with:
          path: |
            .sst
          key: ${{ runner.os }}-sst

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v1
        with:
          node-version: "22"

      - name: deps
        run: bun install --frozen-lockfile

      - uses: developing-software/agents/actions/event/emit@dev
        with:
          token: ${{ secrets.AGENTS_TOKEN }}
          event_id_env: AGENTS_WORKFLOW_EVENT_ID
          type: sst.deploy.started
          tags: env:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
          data: >-
            {"stage":"${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}"}

      - name: build console
        run: bun run build
        working-directory: packages/console

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}

        run: |
          bunx sst install
          bunx sst deploy --stage=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}

      - uses: developing-software/agents/actions/event/emit@dev
        if: always()
        with:
          token: ${{ secrets.AGENTS_TOKEN }}
          type: sst.deploy.completed
          tags: env:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
          data: >-
            {"stage":"${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}","outcome":"${{ steps.deploy.outcome }}"}
