name: Tests
run-name: "${{ github.event_name == 'pull_request' && format('tests/pr-{0}', github.event.pull_request.number) || format('tests/{0}', github.sha) }}"

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        id: run-tests
        uses: ./.github/actions/test

      - name: Write summary
        if: always()
        run: |
          STATUS="${{ steps.run-tests.outputs.outcome }}"
          if [ "$STATUS" == "success" ]; then
            echo "## Tests Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Tests Failed" >> $GITHUB_STEP_SUMMARY
          fi
          {
            echo ""
            echo "<details><summary>Test output</summary>"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/test-output.txt"
            echo '```'
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY

      - name: Fail if tests failed
        if: steps.run-tests.outputs.outcome == 'failure'
        run: exit 1
