name: "Agent → OpenCode"
run-name: "agent-opencode/${{ github.run_id }}"

on:
  workflow_call:
    inputs:
      prompt:
        description: "Task/instructions for the agent"
        required: true
        type: string
      tags:
        description: "Comma-separated tags for event linking (e.g. gh:issue:42)"
        required: false
        type: string
        default: ""
      model:
        description: "Model override"
        required: false
        type: string
    secrets:
      AGENTS_TOKEN:
        required: true
      OPENAI_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task/instructions for the agent"
        required: true
        type: string
      tags:
        description: "Comma-separated tags (e.g. gh:issue:42)"
        required: false
        type: string
        default: ""
      model:
        description: "Model override"
        required: false
        type: string

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - uses: ./actions/agent/workflow
        with:
          pr_prefix: opencode
          harness: opencode
          tags: ${{ inputs.tags }}
          token: ${{ secrets.AGENTS_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run OpenCode
        id: run-opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          model: ${{ inputs.model || 'openai/gpt-5.4-pro' }}
          prompt: |
            ${{ inputs.prompt }}

      - uses: ./actions/agent/opencode
        if: always()
        with:
          token: ${{ secrets.AGENTS_TOKEN }}

      - uses: ./.github/actions/lint
        with:
          install: "false"
          token: ${{ secrets.AGENTS_TOKEN }}

      - uses: ./.github/actions/typecheck
        with:
          install: "false"
          token: ${{ secrets.AGENTS_TOKEN }}

      - uses: ./.github/actions/test
        with:
          install: "false"
          token: ${{ secrets.AGENTS_TOKEN }}
