name: "Agent → OpenCode"
run-name: "agent-opencode/${{ github.run_id }}"

on:
  workflow_call:
    inputs:
      prompt:
        description: "Task/instructions for the agent"
        required: true
        type: string
      tags:
        description: "Tags for event linking, one per line (e.g. gh:issue:42)"
        required: false
        type: string
        default: ""
      model:
        description: "Model override"
        required: false
        type: string
    secrets:
      AGENTS_TOKEN:
        required: true
      OPENAI_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task/instructions for the agent"
        required: true
        type: string
      tags:
        description: "Tags for event linking, one per line (e.g. gh:issue:42)"
        required: false
        type: string
        default: ""
      model:
        description: "Model override"
        required: false
        type: string

jobs:
  implement:
    runs-on: ubuntu-latest
    env:
      MODEL: ${{ inputs.model || 'openai/gpt-5.4-pro' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - uses: ./actions/event/init
        with:
          type: agent
          token: ${{ secrets.AGENTS_TOKEN }}
          tags: |
            harness:opencode
            model:${{ env.MODEL }}
            ${{ inputs.tags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract issue number
        id: issue
        run: |
          ISSUE=$(echo "${{ inputs.tags }}" | grep -oP '^gh:issue:\K\d+$' || true)
          echo "number=$ISSUE" >> "$GITHUB_OUTPUT"

      - uses: ./actions/git/branch
        with:
          prefix: opencode
          issue_number: ${{ steps.issue.outputs.number }}

      - uses: ./actions/comment/create
        if: steps.issue.outputs.number != ''
        with:
          issue_number: ${{ steps.issue.outputs.number }}
        env:
          DEV_AGENTS_HARNESS: opencode

      - name: Run OpenCode
        id: run-opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          model: ${{ env.MODEL }}
          prompt: |
            ${{ inputs.prompt }}

      - uses: ./actions/agent/opencode
        if: always()

      - uses: ./.github/actions/check
        if: always()
        with:
          install: "false"

      - uses: ./actions/git/commit
        if: always()
        with:
          issue_number: ${{ steps.issue.outputs.number }}

      - uses: ./actions/git/pr
        if: always()
        with:
          prefix: opencode
          issue_number: ${{ steps.issue.outputs.number }}

      - uses: ./actions/comment/update
        if: always() && steps.issue.outputs.number != ''
