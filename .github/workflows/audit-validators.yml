name: "Audit: Validators"
run-name: "audit-validators/${{ github.run_id }}"

on:
  schedule:
    - cron: "0 8 * * 3" # Weekly on Wednesday at 08:00 UTC
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - uses: ./.github/actions/audit
        with:
          audit_name: validators
          report_title: Validator Audit
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          token: ${{ secrets.AGENTS_TOKEN }}
          prompt: |
            You are running a validator audit of this repository.

            Your job: analyze how Zod validators are defined in `packages/core` and whether `packages/functions` (OpenAPI routes) and `packages/console` (remote server functions) properly reuse those core validators vs duplicating field definitions inline.

            The ideal pattern is reusing core validator types via `Info.shape.<field>` or `Info.pick(...)` so that when a field type or validation changes in core, it auto-updates across all packages.

            ## Output

            The file `.agents/reports/audit-validators.md` already exists with a header. Append your findings to it.

            IMPORTANT:
            - Do NOT create GitHub issues or PRs -- the workflow handles that.
            - Do NOT modify any source files -- this is a read-only audit.
            - Only write to `.agents/reports/audit-validators.md`.
            - Fill in every section with real findings. No placeholders or template text.

            ## Execution Strategy

            Use subagents (Agent tool) to parallelize the audit. Each subagent should:
            - Research its assigned audit category by reading the relevant files
            - Return its findings as structured text back to you
            Then you compile all findings and write the final report to `.agents/reports/audit-validators.md`.

            Launch these subagents in parallel:
            1. **Core Schemas agent** -- Steps 1-3 below
            2. **Functions Validators agent** -- Steps 4-6 below
            3. **Console Validators agent** -- Steps 7-9 below
            4. **Cross-Package Duplication agent** -- Steps 10-12 below

            After all subagents complete, compile their findings into the report file.

            ## Audit Protocol

            ### Step 1-3: Core Schema Inventory

            1. Read all core model files and catalog every exported Zod schema (`Info`, `*Input`, `*Options`, etc.):
               - `packages/core/src/user/index.ts`
               - `packages/core/src/repository/index.ts`
               - `packages/core/src/events/index.ts`
               - `packages/core/src/plan/index.ts`
               - `packages/core/src/agent/skill.ts`
               - `packages/core/src/agent/spec.ts`
               - `packages/core/src/api/api.ts`
               - `packages/core/src/github/repo/issue.ts`
               - `packages/core/src/github/repo/pull_request.ts`
               - `packages/core/src/tag/index.ts`
               - `packages/core/src/common.ts`
               For each schema, record: namespace, name, fields with their Zod types (e.g. `z.string()`, `z.enum(...)`, `z.number().int().positive()`).

            2. For each core model, check if it already provides derived schemas (create/update inputs). Record which use good reuse patterns:
               - `.shape.<field>` -- extracting individual fields from the parent Info schema
               - `.pick({...})` -- selecting a subset of fields
               - `.partial()` -- making fields optional for update inputs
               - `.extend({...})` -- extending the base schema
               Note models that define `Info` but lack corresponding input schemas that downstream packages need.

            3. Identify fields that appear in multiple core schemas with identical semantics but different definitions. For example:
               - `id` fields -- are they all `z.string()` or do some add `.ulid()` etc?
               - `tags` fields -- are they all `z.array(z.string())`?
               - `source`/`sourceId` fields -- same definition across Event, Plan, Repository?
               - `timeCreated`/`timeUpdated` -- consistent across models?

            ### Step 4-6: Functions Package (OpenAPI Routes)

            4. Read all route handler files under `packages/functions/src/api/handler/`:
               - `github.ts`, `event.ts`, `profile.ts`, `token.ts`, `app.ts`, `auth.ts`
               For each route, record how request validators are defined:
               - **Reuses core**: e.g. `validator("json", Event.IngestInput)` or `Api.Personal.Info.shape.id`
               - **Inline definition**: e.g. `z.object({ owner: z.string(), repo: z.string() })`
               - **Mixed**: some fields from core, some inline

            5. For each inline validator, check if an equivalent schema exists in core that could be used instead. Flag:
               - Fields that duplicate a core `Info.shape.<field>` definition
               - Entire schemas that could be replaced by a core `*Input` schema
               - Parameter validators (path params, query params) that re-define fields like `id` instead of using `Info.shape.id`

            6. Read `packages/functions/src/api/common.ts` -- understand the `validator()` wrapper and how it integrates with OpenAPI metadata via `.meta()`. Note whether `.meta()` info is preserved when using `.shape` extraction (it should be).

            ### Step 7-9: Console Package (Remote Functions)

            7. Read all remote function files:
               - `packages/console/src/routes/gh/[organization]/[repo]/repo.remote.ts`
               - `packages/console/src/lib/agents/plans/plans.remote.ts`
               - `packages/console/src/lib/github/github.remote.ts`
               - `packages/console/src/lib/agents/dispatch/dispatch.remote.ts`
               - `packages/console/src/lib/events/events.remote.ts`
               - `packages/console/src/lib/ai/judge.remote.ts`
               For each `query()` and `command()` call, record how the input validator is defined (reuses core vs inline).

            8. For each inline validator, compare against the core schema it should reference:
               - `dispatchAgent` in `repo.remote.ts` -- compare field-by-field with `DispatchInput` in `packages/functions/src/api/handler/github.ts` and note both duplicate the same fields
               - `createPlan` / `updatePlan` in `plans.remote.ts` -- compare with `Plan.Info.shape` fields. Note that `authorType: z.enum(["human", "llm"])` duplicates `Plan.Info.shape.authorType` and `status: z.enum([...])` duplicates `Plan.Info.shape.status`
               - `listPlans` and similar -- check if `organization`/`repoName` params could use a shared input shape

            9. Check if the console package imports core types but doesn't use their validators. Search for patterns like:
               - `import { Plan } from "@agents/core/plan/index"` followed by inline `z.object(...)` that duplicates Plan fields
               - `import { Event } from "@agents/core/events/index"` followed by inline schemas

            ### Step 10-12: Cross-Package Duplication Analysis

            10. Build a duplication matrix: for each core schema field, list everywhere it is re-defined inline instead of using `.shape` extraction. Format as a table:
                | Core Field | Core Type | Duplicated In | Inline Type | Match? |
                Flag mismatches where the inline type differs from core (e.g. missing `.int().positive()`, different `.default()`, different optionality).

            11. Identify the highest-impact fixes -- schemas where:
                - The most fields are duplicated (biggest bang for the buck)
                - A type mismatch exists (actual bug risk)
                - The core schema already exports a suitable input type that's being ignored

            12. For cases where core doesn't yet export a reusable input schema, recommend what to add. For example:
                - `AgentWorkflow.DispatchInput` in core to replace inline definitions in both functions and console
                - `Plan.CreateInput` / `Plan.UpdateInput` if not already exported
                - A shared `RepoInput` shape for `{ organization, repo }` patterns

            ## Known Issues Seed List

            Verify whether each still exists:
            - `DispatchInput` in `packages/functions/src/api/handler/github.ts` is defined inline instead of in core, and duplicated in `packages/console/src/routes/gh/[organization]/[repo]/repo.remote.ts`
            - `createPlan` in `plans.remote.ts` uses `z.enum(["human", "llm"])` instead of reusing `AuthorType` from core
            - `updatePlan` in `plans.remote.ts` hardcodes the status enum array instead of using `PlanStatus` from core
            - `profile.ts` update route defines `z.object({ name: z.string(), email: z.email() })` inline instead of deriving from `User.Info`
            - Console remote functions frequently use `z.object({ organization: z.string(), repoName: z.string() })` -- a shared input shape could DRY this up

            ## Report Format

            Write `.agents/reports/audit-validators.md` with these sections. Fill every section with real findings -- no placeholders.

            - **Summary** -- Total findings count, severity breakdown (critical = type mismatch / improvement = inline duplication / suggestion = missing core input schema).
            - **Core Schema Inventory** -- Table of all schemas, their fields, and which provide derived input types.
            - **Cross-Field Consistency** -- Fields shared across core models: are definitions consistent?
            - **Functions Package > Duplication Found** -- Each: route, inline schema, which core schema it should use, suggested refactor.
            - **Functions Package > Good Reuse** -- Routes already using core schemas correctly.
            - **Console Package > Duplication Found** -- Each: remote function, inline schema, which core schema it should use, suggested refactor.
            - **Console Package > Good Reuse** -- Remote functions already using core schemas correctly.
            - **Duplication Matrix** -- Table of core fields duplicated across packages.
            - **Type Mismatches** -- Cases where inline type differs from core (highest severity).
            - **Missing Core Input Schemas** -- Schemas that should be added to core to enable reuse.
            - **Recommended Actions** -- Prioritized, each actionable as a standalone issue. Include code snippets showing the before (inline) and after (reuse) patterns.
