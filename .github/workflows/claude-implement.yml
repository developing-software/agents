name: Claude - Implement Issue
run-name: "claude/issue-${{ github.event.issue.number }}-${{ github.run_id }}"

on:
  issues:
    types: [labeled]

concurrency:
  group: claude-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.label.name == 'claude'
    runs-on: ubuntu-latest
    env:
      CLAUDE_MODEL: claude-sonnet-4-6
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - uses: ./actions/agents/workflow
        with:
          pr_prefix: claude
          harness: claude-code
          model: ${{ env.CLAUDE_MODEL }}
          token: ${{ secrets.AGENTS_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Claude Code
        id: run-claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --model ${{ env.CLAUDE_MODEL }} --output-format stream-json --verbose --dangerously-skip-permissions
          prompt: |
            Implement the following GitHub issue:

            Title: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            Make the necessary code changes to implement this feature or fix.
            Follow the existing code style, naming conventions, and patterns in the codebase.
            Do NOT commit, push, or open a pull request — only modify the files.
          additional_permissions: |
            actions: read

      - uses: ./actions/agent/claude
        if: always()
        with:
          execution_file: ${{ steps.run-claude.outputs.execution_file }}
          session_id: ${{ steps.run-claude.outputs.session_id }}
          token: ${{ secrets.AGENTS_TOKEN }}

      - uses: ./.github/actions/test
        with:
          install: "false"
          token: ${{ secrets.AGENTS_TOKEN }}
