name: Teardown SST
run-name: "Teardown SST #${{ github.event.pull_request.number }}"

on:
  pull_request:
    types: [closed]
    branches:
      - dev
      - prod

concurrency:
  group: ${{ github.ref }}

jobs:
  remove:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v1
        with:
          node-version: "22"

      - name: deps
        run: bun install --frozen-lockfile

      - uses: developing-software/agents/actions/event/emit@dev
        with:
          token: ${{ secrets.AGENTS_TOKEN }}
          event_id_env: AGENTS_WORKFLOW_EVENT_ID
          type: sst.remove.started
          tags: env:pr-${{ github.event.pull_request.number }}
          data: >-
            {"stage":"pr-${{ github.event.pull_request.number }}"}

      - name: Remove
        id: remove
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}

        run: |
          bunx sst install
          bunx sst remove --stage=pr-${{ github.event.pull_request.number }}

      - uses: developing-software/agents/actions/event/emit@dev
        if: always()
        with:
          token: ${{ secrets.AGENTS_TOKEN }}
          type: sst.remove.completed
          tags: env:pr-${{ github.event.pull_request.number }}
          data: >-
            {"stage":"pr-${{ github.event.pull_request.number }}","outcome":"${{ steps.remove.outcome }}"}
