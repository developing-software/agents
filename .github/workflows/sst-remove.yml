name: Teardown SST
run-name: "Teardown SST #${{ github.event.pull_request.number }}"

on:
  pull_request:
    types: [closed]
    branches:
      - dev

concurrency:
  group: ${{ github.ref }}

jobs:
  remove:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v1
        with:
          node-version: "22"

      - name: deps
        run: bun install --frozen-lockfile

      - name: Compute stage
        run: echo "STAGE=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"

      - uses: developing-software/agents/actions/event/init@dev
        with:
          token: ${{ secrets.AGENTS_TOKEN }}
          type: deploy.remove
          tags: |
            env:${{ env.STAGE }}
            tool:sst
          data: >-
            {"stage":"${{ env.STAGE }}","tool":"sst"}

      - name: Remove
        id: remove
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}

        run: |
          bunx sst install
          bunx sst remove --stage=${{ env.STAGE }}

      - name: Delete deploy preview comment
        if: success()
        uses: actions/github-script@v7
        env:
          TOOL: sst
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tool = process.env.TOOL;
            const marker = `<!-- deploy:${tool} -->`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const found = existing.find(c => c.body && c.body.includes(marker));
            if (found) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: found.id });
              core.info(`Deleted deploy preview comment ${found.id}`);
            } else {
              core.info('No deploy preview comment found — nothing to delete.');
            }
