name: OpenCode - Implement Issue
run-name: "opencode/issue-${{ github.event.issue.number }}-${{ github.run_id }}"

on:
  issues:
    types: [labeled]

concurrency:
  group: opencode-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.label.name == 'opencode'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - uses: ./actions/agent/workflow
        with:
          pr_prefix: opencode
          harness: opencode
          token: ${{ secrets.AGENTS_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run OpenCode
        id: run-opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          model: openai/gpt-5.4-pro
          prompt: |
            Implement the following GitHub issue in this repository:

            Title: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            Make the necessary code changes to implement this feature or fix.
            Follow the existing code style, naming conventions, and patterns in the codebase.
            Refer to AGENTS.md for project structure and guidelines.
            Do NOT commit, push, or open a pull request — only modify the files.

      - uses: ./.github/actions/test
        with:
          install: "false"
          token: ${{ secrets.AGENTS_TOKEN }}
