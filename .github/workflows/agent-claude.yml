name: "Agent → Claude"
run-name: "agent-claude/${{ github.run_id }}"

on:
  workflow_call:
    inputs:
      prompt:
        description: "Task/instructions for the agent"
        required: true
        type: string
      tags:
        description: "Tags for event linking, one per line (e.g. gh:issue:42)"
        required: false
        type: string
        default: ""
      model:
        description: "Model override"
        required: false
        type: string
    secrets:
      AGENTS_TOKEN:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task/instructions for the agent"
        required: true
        type: string
      tags:
        description: "Tags for event linking, one per line (e.g. gh:issue:42)"
        required: false
        type: string
        default: ""
      model:
        description: "Model override"
        required: false
        type: string

jobs:
  implement:
    runs-on: ubuntu-latest
    env:
      MODEL: ${{ inputs.model || 'claude-sonnet-4-6' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - uses: ./actions/event/init
        with:
          type: agent
          token: ${{ secrets.AGENTS_TOKEN }}
          tags: |
            harness:claude-code
            model:${{ env.MODEL }}
            ${{ inputs.tags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract issue number
        id: issue
        run: |
          ISSUE=$(echo "${{ inputs.tags }}" | grep -oP '^gh:issue:\K\d+$' || true)
          echo "number=$ISSUE" >> "$GITHUB_OUTPUT"

      - uses: ./actions/git/branch
        with:
          prefix: claude
          issue_number: ${{ steps.issue.outputs.number }}

      - uses: ./actions/comment
        with:
          phase: progress
          agent: claude-code

      - name: Run Claude Code
        id: run-claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --model ${{ env.MODEL }} --output-format stream-json --verbose --dangerously-skip-permissions
          prompt: |
            ${{ inputs.prompt }}
          allowed_bots: "*"
          additional_permissions: |
            actions: read

      - uses: ./actions/agent
        if: always()
        with:
          agent: claude-code
          execution_file: ${{ steps.run-claude.outputs.execution_file }}
          session_id: ${{ steps.run-claude.outputs.session_id }}
          model: ${{ env.MODEL }}
          provider: anthropic
          status: ${{ steps.run-claude.outcome }}

      - uses: ./.github/actions/check
        if: always()
        with:
          install: "false"

      - uses: ./actions/git/commit
        if: always()
        with:
          issue_number: ${{ steps.issue.outputs.number }}

      - uses: ./actions/git/pr
        if: always()
        with:
          prefix: claude
          issue_number: ${{ steps.issue.outputs.number }}

      - uses: ./actions/comment
        if: always()
        with:
          phase: summary
