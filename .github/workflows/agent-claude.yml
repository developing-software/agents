name: "Agent → Claude"
run-name: "agent-claude/${{ github.run_id }}"

on:
  workflow_call:
    inputs:
      prompt:
        description: "Task/instructions for the agent"
        required: true
        type: string
      tags:
        description: "Comma-separated tags for event linking (e.g. gh:issue:42)"
        required: false
        type: string
        default: ""
      model:
        description: "Model override"
        required: false
        type: string
    secrets:
      AGENTS_TOKEN:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task/instructions for the agent"
        required: true
        type: string
      tags:
        description: "Comma-separated tags (e.g. gh:issue:42)"
        required: false
        type: string
        default: ""
      model:
        description: "Model override"
        required: false
        type: string

jobs:
  implement:
    runs-on: ubuntu-latest
    env:
      MODEL: ${{ inputs.model || 'claude-sonnet-4-6' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - uses: ./actions/agent/workflow
        with:
          pr_prefix: claude
          harness: claude-code
          model: ${{ env.MODEL }}
          tags: ${{ inputs.tags }}
          token: ${{ secrets.AGENTS_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Claude Code
        id: run-claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --model ${{ env.MODEL }} --output-format stream-json --verbose --dangerously-skip-permissions
          prompt: |
            ${{ inputs.prompt }}
          allowed_bots: "*"
          additional_permissions: |
            actions: read

      - uses: ./actions/agent/claude
        if: always()
        with:
          execution_file: ${{ steps.run-claude.outputs.execution_file }}
          session_id: ${{ steps.run-claude.outputs.session_id }}
          model: ${{ env.MODEL }}
          token: ${{ secrets.AGENTS_TOKEN }}

      - uses: ./.github/actions/lint
        with:
          install: "false"
          token: ${{ secrets.AGENTS_TOKEN }}

      - uses: ./.github/actions/typecheck
        with:
          install: "false"
          token: ${{ secrets.AGENTS_TOKEN }}

      - uses: ./.github/actions/test
        with:
          install: "false"
          token: ${{ secrets.AGENTS_TOKEN }}
