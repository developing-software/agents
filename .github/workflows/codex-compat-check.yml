name: "Audit → Codex Compatibility"
run-name: "audit-codex-compat/${{ github.run_id }}"

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run minimal Codex exec
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: "Reply with only the single word: hello"
          sandbox: read-only
          codex-home: /tmp/codex-check

      - name: Collect metrics via action
        id: metrics
        uses: ./actions/agent
        with:
          agent: codex
          provider: openai
          status: success
        env:
          CODEX_HOME: /tmp/codex-check
          DEV_AGENTS_RESULTS_DIR: /tmp/results

      - name: Verify metrics extracted
        run: |
          data="/tmp/results/agent/data.json"

          if [ ! -f "$data" ]; then
            echo "::error::data.json not written"
            exit 1
          fi

          echo "data.json contents:"
          cat "$data" | jq .

          input=$(jq '.metrics.tokens.input // empty' "$data")
          output=$(jq '.metrics.tokens.output // empty' "$data")

          if [ -z "$input" ] || [ "$input" = "null" ] || [ "$input" -eq 0 ]; then
            echo "::error::metrics.tokens.input is missing or zero — extractor failed to parse rollout"
            exit 1
          fi

          if [ -z "$output" ] || [ "$output" = "null" ] || [ "$output" -eq 0 ]; then
            echo "::error::metrics.tokens.output is missing or zero"
            exit 1
          fi

          echo "Metrics verified — input=$input output=$output"

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const title = `Codex rollout compat check failed (${date})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'codex-compat',
            });

            if (existing.length > 0) {
              console.log(`Open codex-compat issue already exists (#${existing[0].number}), skipping.`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['codex-compat'],
              body: [
                '## Codex rollout JSONL compatibility check failed',
                '',
                'The nightly check that verifies `openai/codex-action` still writes token counts',
                'in a format our extractor can parse has failed. This likely means the `@openai/codex`',
                'CLI changed its internal session file format.',
                '',
                '**Impact:** Codex agent runs will report null metrics until this is fixed.',
                '',
                `**Failed run:** ${runUrl}`,
                '',
                '## What to check',
                '',
                '1. Look at the failed step logs for which assertion failed',
                '2. Run `codex exec "say hello"` locally and inspect `~/.codex/sessions/`',
                '3. If the format changed, update `extractCodex()` in `actions/agent/src/extractors/codex.ts`',
              ].join('\n'),
            });
