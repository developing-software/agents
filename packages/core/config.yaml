development:
  database:
    host: localhost
    port: 5432
    username: postgres
    password: postgres
    name: app_development
  redis:
    host: localhost
    port: 6379
  bus:
    type: memory
  api:
    url: http://localhost:3000
    key: dev_key_12345

staging:
  database:
    host: ${DB_HOST}
    port: 5432
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    name: ${DB_NAME}
  redis:
    host: ${REDIS_HOST}
    port: 6379
  bus:
    type: redis
  api:
    url: https://staging-api.example.com
    key: ${API_KEY}

production:
  database:
    host: ${DB_HOST}
    port: 5432
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    name: ${DB_NAME}
  redis:
    host: ${REDIS_HOST}
    port: 6379
  bus:
    type: redis
  api:
    url: https://api.example.com
    key: ${API_KEY}
