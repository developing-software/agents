name: Upload Implement Artifacts
description: Upload files from IMPLEMENT_ARTIFACT_DIR (and IMPLEMENT_METRICS) to the Agents API R2 bucket

inputs:
  agents_token:
    description: Personal access token for the Agents API
    required: true
  api_url:
    description: Agents API base URL
    required: false
    default: https://api.agents.developing.company/api

runs:
  using: node20
  main: dist/main.js
