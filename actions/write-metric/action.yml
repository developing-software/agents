name: Write Metric
description: Append a key=value metric to $IMPLEMENT_METRICS if present

inputs:
  key:
    description: Metric name
    required: true
  value:
    description: Metric value
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        METRIC_KEY: ${{ inputs.key }}
        METRIC_VALUE: ${{ inputs.value }}
      run: |
        if [ -n "$IMPLEMENT_METRICS" ]; then
          printf '%s=%s\n' "$METRIC_KEY" "$METRIC_VALUE" >> "$IMPLEMENT_METRICS"
        fi
