name: Collect Codex Metrics
description: Capture result and stage artifacts from a codex-action step

inputs:
  final_message:
    description: Final message output from openai/codex-action
    required: false

runs:
  using: composite
  steps:
    - uses: developing-software/agents/actions/write-metric@main
      if: inputs.final_message != ''
      with:
        key: result
        value: ${{ inputs.final_message }}

    - name: Stage artifacts
      if: always()
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/implement-artifacts"
        echo "IMPLEMENT_ARTIFACT_DIR=$RUNNER_TEMP/implement-artifacts" >> "$GITHUB_ENV"
