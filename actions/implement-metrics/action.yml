name: Implement
description: Setup and teardown hooks for AI agent implementation workflows

inputs:
  pr_prefix:
    description: Branch/PR prefix (e.g. claude, codex)
    required: true
  harness:
    description: Agent harness identifier (e.g. claude-code, codex)
    required: false
  model:
    description: Model identifier written to metrics (e.g. claude-sonnet-4-6)
    required: false
  tags:
    description: Extra concrete tags to attach to created events, comma or newline separated
    required: false
  base_branch:
    description: "Base branch for the PR (default: repo default branch)"
    required: false
  metadata:
    description: Extra key=value metrics to include in the summary, one per line
    required: false
  agents_token:
    description: Personal access token for posting events to the Agents API
    required: false
  api_url:
    description: Agents API base URL
    required: false
    default: https://api.agents.developing.company/api

runs:
  using: node20
  main: dist/main.js
  post: dist/post.js
  post-if: always()
