name: Tag Event Context
description: Write a tag file to the workflow context (DEV_AGENTS_TAGS_DIR). All subsequent event/emit calls will inherit it. Writing the same slug overwrites the previous value.

inputs:
  slug:
    description: "Tag file name (e.g. harness, model, gh-issue). Writing the same slug overwrites."
    required: true
  value:
    description: "Full tag string (e.g. harness:claude-code, gh:pr:123)"
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        INPUT_SLUG: ${{ inputs.slug }}
        INPUT_VALUE: ${{ inputs.value }}
      run: |
        if [ -z "${DEV_AGENTS_TAGS_DIR:-}" ]; then
          exit 0
        fi
        printf '%s\n' "$INPUT_VALUE" > "$DEV_AGENTS_TAGS_DIR/$INPUT_SLUG"
