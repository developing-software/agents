name: Write Check Result
description: Write a check result to the results folder and auto-tag the context

inputs:
  category:
    description: "Result category (e.g. tests, lint)"
    required: true
  name:
    description: "Check name (e.g. unit, oxlint, tsc)"
    required: true
  outcome:
    description: "Check outcome: success or failure"
    required: true
  output:
    description: "Optional path to output file to copy into the results folder"
    required: false

runs:
  using: composite
  steps:
    - name: Write result
      if: always()
      shell: bash
      env:
        CATEGORY: ${{ inputs.category }}
        CHECK_NAME: ${{ inputs.name }}
        OUTCOME: ${{ inputs.outcome }}
        OUTPUT_PATH: ${{ inputs.output }}
      run: |
        if [ -z "${DEV_AGENTS_RESULTS_DIR:-}" ]; then
          exit 0
        fi
        mkdir -p "$DEV_AGENTS_RESULTS_DIR/$CATEGORY/$CHECK_NAME"
        printf '{"outcome":"%s"}\n' "$OUTCOME" > "$DEV_AGENTS_RESULTS_DIR/$CATEGORY/$CHECK_NAME/result.json"
        if [ -n "$OUTPUT_PATH" ] && [ -f "$OUTPUT_PATH" ]; then
          cp "$OUTPUT_PATH" "$DEV_AGENTS_RESULTS_DIR/$CATEGORY/$CHECK_NAME/output.txt"
        fi

        # Auto-tag: write check tag to tags dir
        if [ -n "${DEV_AGENTS_TAGS_DIR:-}" ]; then
          SLUG="check-$(echo "${CATEGORY}-${CHECK_NAME}" | tr '/' '-')"
          printf 'check:%s/%s:%s\n' "$CATEGORY" "$CHECK_NAME" "$OUTCOME" > "$DEV_AGENTS_TAGS_DIR/$SLUG"
        fi

    - name: Update issue comment
      if: always() && env.DEV_AGENTS_COMMENT_ID
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        HARNESS="${DEV_AGENTS_HARNESS:-agent}"

        LINES=()
        LINES+=("> **Agent workflow in progress**")
        LINES+=(">")
        LINES+=("> **Run:** [View workflow run](${DEV_AGENTS_RUN_URL})")
        [ -n "${DEV_AGENTS_BRANCH:-}" ] && LINES+=("> **Branch:** \`${DEV_AGENTS_BRANCH}\`")
        LINES+=("> **Agent:** ${HARNESS}")
        LINES+=(">")

        # Scan results dir for all check outcomes (skip metadata/)
        LINES+=("| Check | Status |")
        LINES+=("|-------|--------|")
        for cat_dir in "$DEV_AGENTS_RESULTS_DIR"/*/; do
          cat_name=$(basename "$cat_dir")
          [ "$cat_name" = "metadata" ] && continue
          for name_dir in "$cat_dir"*/; do
            [ -d "$name_dir" ] || continue
            check_name=$(basename "$name_dir")
            result_file="$name_dir/result.json"
            if [ -f "$result_file" ]; then
              outcome=$(jq -r '.outcome // "unknown"' "$result_file")
              case "$outcome" in
                success) icon="pass" ;;
                failure) icon="FAIL" ;;
                *)       icon="-"    ;;
              esac
              LINES+=("| ${cat_name}/${check_name} | ${icon} |")
            fi
          done
        done

        BODY=$(printf '%s\n' "${LINES[@]}")

        gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${DEV_AGENTS_COMMENT_ID}" \
          -X PATCH -f body="$BODY" --silent || echo "::warning::Failed to update issue comment"
