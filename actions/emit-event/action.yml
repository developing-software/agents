name: Emit Event
description: Emit a generic event to the Agents API during a workflow

inputs:
  agents_token:
    description: Personal access token for posting events to the Agents API
    required: true
  api_url:
    description: Agents API base URL
    required: false
    default: https://api.agents.developing.company/api
  parent_event_id:
    description: Parent event ID for chaining related events
    required: false
  event_id_env:
    description: Environment variable to export the created event id to, and to read as the default parent event id on later calls
    required: false
    default: EVENT_ID
  origin:
    description: Event origin
    required: false
    default: action
  type:
    description: Event type
    required: true
  tags:
    description: Concrete tags to attach to the event, comma or newline separated
    required: false
  data:
    description: JSON object to store as event data
    required: false

outputs:
  event_id:
    description: Created event ID

runs:
  using: node20
  main: dist/main.js
