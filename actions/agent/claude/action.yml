name: Collect Claude Agent Data
description: Capture token usage from claude-code-action and emit result event with metrics in data

inputs:
  execution_file:
    description: Path to the execution JSON file from claude-code-action
    required: false
  session_id:
    description: Session ID from claude-code-action
    required: false
  model:
    description: Model used for the Claude agent run
    required: false
runs:
  using: composite
  steps:
    - name: Capture token usage
      if: always()
      shell: bash
      env:
        EXECUTION_FILE: ${{ inputs.execution_file }}
        SESSION_ID: ${{ inputs.session_id }}
      run: |
        if [ ! -f "${EXECUTION_FILE:-}" ]; then
          # No execution file — still export SESSION_ID and empty metrics
          {
            printf 'METRICS_JSON<<_AGENTS_EOF\n'
            printf 'null\n'
            printf '_AGENTS_EOF\n'
          } >> "$GITHUB_ENV"

          if [ -n "$SESSION_ID" ]; then
            {
              printf 'SESSION_ID_JSON<<_AGENTS_EOF\n'
              printf '"%s"\n' "$SESSION_ID"
              printf '_AGENTS_EOF\n'
            } >> "$GITHUB_ENV"
          fi
          exit 0
        fi

        RESULT=$(jq -c '.[] | select(.type == "result")' "$EXECUTION_FILE" 2>/dev/null | tail -1)
        [ -z "$RESULT" ] && exit 0

        INPUT=$(printf '%s' "$RESULT"        | jq -r '.usage.input_tokens // empty')
        OUTPUT=$(printf '%s' "$RESULT"       | jq -r '.usage.output_tokens // empty')
        CACHE_READ=$(printf '%s' "$RESULT"   | jq -r '.usage.cache_read_input_tokens // empty')
        CACHE_CREATE=$(printf '%s' "$RESULT" | jq -r '.usage.cache_creation_input_tokens // empty')
        TURNS=$(printf '%s' "$RESULT"        | jq -r '.num_turns // empty')
        COST=$(printf '%s' "$RESULT"         | jq -r '.total_cost_usd // empty')
        MODEL=$(printf '%s' "$RESULT"        | jq -r '.model // empty')
        LAST_MSG=$(printf '%s' "$RESULT"     | jq -r '.result // empty')

        METRICS_JSON=$(jq -nc \
          --argjson input   "${INPUT:-null}" \
          --argjson output  "${OUTPUT:-null}" \
          --argjson cread   "${CACHE_READ:-null}" \
          --argjson ccreate "${CACHE_CREATE:-null}" \
          --argjson turns   "${TURNS:-null}" \
          --argjson cost    "${COST:-null}" \
          --arg     model   "${MODEL:-}" \
          '{
            tokens: { input: $input, output: $output, reasoning: null, cache_read: $cread, cache_creation: $ccreate },
            turns: $turns,
            cost_usd: $cost,
            model: (if $model == "" then null else $model end)
          }')

        {
          printf 'METRICS_JSON<<_AGENTS_EOF\n'
          printf '%s\n' "$METRICS_JSON"
          printf '_AGENTS_EOF\n'
        } >> "$GITHUB_ENV"

        if [ -n "$SESSION_ID" ]; then
          {
            printf 'SESSION_ID_JSON<<_AGENTS_EOF\n'
            printf '"%s"\n' "$SESSION_ID"
            printf '_AGENTS_EOF\n'
          } >> "$GITHUB_ENV"
        fi

        if [ -n "$LAST_MSG" ]; then
          {
            printf 'LAST_MSG<<_AGENTS_EOF\n'
            printf '%s\n' "$LAST_MSG"
            printf '_AGENTS_EOF\n'
          } >> "$GITHUB_ENV"
        fi

        AGENT_MODEL="${{ inputs.model }}"
        [ -z "$AGENT_MODEL" ] && AGENT_MODEL="$MODEL"
        if [ -n "$AGENT_MODEL" ]; then
          echo "AGENT_MODEL=$AGENT_MODEL" >> "$GITHUB_ENV"
        fi

    - name: Write agent result to metadata folder
      if: always()
      shell: bash
      run: |
        if [ -n "${DEV_AGENTS_RESULTS_DIR:-}" ]; then
          mkdir -p "$DEV_AGENTS_RESULTS_DIR/agent"
          jq -nc \
            --arg name "claude-code" \
            --argjson sessionId "${SESSION_ID_JSON:-null}" \
            --arg finalMessage "${LAST_MSG:-}" \
            --argjson metrics "${METRICS_JSON:-null}" \
            '{name: $name, sessionId: $sessionId, finalMessage: (if $finalMessage == "" then null else $finalMessage end), metrics: $metrics}' \
            > "$DEV_AGENTS_RESULTS_DIR/agent/data.json"
        fi

    - uses: developing-software/agents/actions/artifact/upload@dev
      if: always() && inputs.execution_file != ''
      with:
        path: ${{ inputs.execution_file }}
        name: claude_code_execution.json
