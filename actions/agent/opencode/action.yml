name: Collect OpenCode Agent Data
description: Capture token usage from opencode session export and emit result event with metrics in data

runs:
  using: composite
  steps:
    - name: Capture token usage
      if: always()
      shell: bash
      run: |
        EXPORT_FILE="${RUNNER_TEMP:-/tmp}/opencode-session.json"

        # Get the most recent session ID (JSON format, handles exit codes gracefully)
        SESSION_ID=$(opencode session list --format json -n 1 2>/dev/null | jq -r '.[0].id // empty') || true

        if [ -n "$SESSION_ID" ]; then
          # Export session JSON to file (avoids shell variable truncation on large sessions)
          opencode export "$SESSION_ID" 2>/dev/null > "$EXPORT_FILE" || true

          if [ -s "$EXPORT_FILE" ] && jq empty "$EXPORT_FILE" 2>/dev/null; then
            INPUT=$(jq '[.messages[]? | select(.info.role == "assistant") | .info.tokens.input // 0] | add' "$EXPORT_FILE")
            OUTPUT=$(jq '[.messages[]? | select(.info.role == "assistant") | .info.tokens.output // 0] | add' "$EXPORT_FILE")
            REASONING=$(jq '[.messages[]? | select(.info.role == "assistant") | .info.tokens.reasoning // 0] | add' "$EXPORT_FILE")
            CACHE_READ=$(jq '[.messages[]? | select(.info.role == "assistant") | .info.tokens.cache.read // 0] | add' "$EXPORT_FILE")
            CACHE_CREATE=$(jq '[.messages[]? | select(.info.role == "assistant") | .info.tokens.cache.write // 0] | add' "$EXPORT_FILE")
            TURNS=$(jq '[.messages[]? | select(.info.role == "assistant")] | length' "$EXPORT_FILE")
            COST=$(jq '[.messages[]? | select(.info.role == "assistant") | .info.cost // 0] | add' "$EXPORT_FILE")
            MODEL=$(jq -r '[.messages[]? | select(.info.role == "assistant")] | last | .info.modelID // empty' "$EXPORT_FILE")

            LAST_MSG=$(jq -r '
              [.messages[]? | select(.info.role == "assistant")] | last // empty |
              .parts | map(select(.type == "text")) | last // empty | .text // empty' "$EXPORT_FILE")
          fi
        fi

        METRICS_JSON=$(jq -nc \
          --argjson input     "${INPUT:-null}" \
          --argjson output    "${OUTPUT:-null}" \
          --argjson reasoning "${REASONING:-null}" \
          --argjson cread     "${CACHE_READ:-null}" \
          --argjson ccreate   "${CACHE_CREATE:-null}" \
          --argjson turns     "${TURNS:-null}" \
          --argjson cost      "${COST:-null}" \
          --arg     model     "${MODEL:-}" \
          '{
            tokens: { input: $input, output: $output, reasoning: $reasoning, cache_read: $cread, cache_creation: $ccreate },
            turns: $turns,
            cost_usd: $cost,
            model: (if $model == "" then null else $model end)
          }')

        {
          printf 'METRICS_JSON<<_AGENTS_EOF\n'
          printf '%s\n' "$METRICS_JSON"
          printf '_AGENTS_EOF\n'
        } >> "$GITHUB_ENV"

        if [ -n "$LAST_MSG" ]; then
          {
            printf 'LAST_MSG<<_AGENTS_EOF\n'
            printf '%s\n' "$LAST_MSG"
            printf '_AGENTS_EOF\n'
          } >> "$GITHUB_ENV"
        fi

        if [ -n "$SESSION_ID" ]; then
          echo "SESSION_ID=$SESSION_ID" >> "$GITHUB_ENV"
        fi

        if [ -n "${MODEL:-}" ]; then
          echo "AGENT_MODEL=$MODEL" >> "$GITHUB_ENV"
        fi

    - name: Write agent result to metadata folder
      if: always()
      shell: bash
      run: |
        if [ -n "${DEV_AGENTS_RESULTS_DIR:-}" ]; then
          mkdir -p "$DEV_AGENTS_RESULTS_DIR/agent"
          jq -nc \
            --arg name "opencode" \
            --arg sessionId "${SESSION_ID:-}" \
            --arg finalMessage "${LAST_MSG:-}" \
            --argjson metrics "${METRICS_JSON:-null}" \
            '{name: $name, sessionId: (if $sessionId == "" then null else $sessionId end), finalMessage: (if $finalMessage == "" then null else $finalMessage end), metrics: $metrics}' \
            > "$DEV_AGENTS_RESULTS_DIR/agent/data.json"
        fi

    - uses: developing-software/agents/actions/artifact/upload@dev
      if: always()
      with:
        path: ${{ runner.temp }}/opencode-session.json
        name: opencode_session.json
