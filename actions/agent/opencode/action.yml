name: Collect OpenCode Agent Data
description: Capture token usage from opencode session export and emit result event with metrics in data

runs:
  using: composite
  steps:
    - name: Capture token usage
      if: always()
      shell: bash
      run: |
        # Get the most recent session ID (third line of output, first column)
        SESSION_ID=$(opencode session list 2>&1 | awk 'NR==3 {print $1}')

        if [ -n "$SESSION_ID" ]; then
          # Export session JSON
          EXPORT=$(opencode export "$SESSION_ID" 2>/dev/null)

          # Write export to temp file for artifact upload
          printf '%s\n' "$EXPORT" > "${RUNNER_TEMP:-/tmp}/opencode-session.json"

          # Extract fields individually from assistant messages (robust pattern)
          ASSISTANTS=$(printf '%s' "$EXPORT" | jq -c '[.messages[]? | select(.info.role == "assistant")]' 2>/dev/null)

          if [ -n "$ASSISTANTS" ] && [ "$ASSISTANTS" != "[]" ] && [ "$ASSISTANTS" != "null" ]; then
            INPUT=$(printf '%s' "$ASSISTANTS"      | jq '[.[].info.tokens.input // 0] | add')
            OUTPUT=$(printf '%s' "$ASSISTANTS"     | jq '[.[].info.tokens.output // 0] | add')
            REASONING=$(printf '%s' "$ASSISTANTS"  | jq '[.[].info.tokens.reasoning // 0] | add')
            CACHE_READ=$(printf '%s' "$ASSISTANTS" | jq '[.[].info.tokens.cache.read // 0] | add')
            CACHE_CREATE=$(printf '%s' "$ASSISTANTS" | jq '[.[].info.tokens.cache.write // 0] | add')
            TURNS=$(printf '%s' "$ASSISTANTS"      | jq 'length')
            COST=$(printf '%s' "$ASSISTANTS"       | jq '[.[].info.cost // 0] | add')
            MODEL=$(printf '%s' "$ASSISTANTS"      | jq -r 'last | .info.modelID // empty')
          fi

          METRICS_JSON=$(jq -nc \
            --argjson input     "${INPUT:-null}" \
            --argjson output    "${OUTPUT:-null}" \
            --argjson reasoning "${REASONING:-null}" \
            --argjson cread     "${CACHE_READ:-null}" \
            --argjson ccreate   "${CACHE_CREATE:-null}" \
            --argjson turns     "${TURNS:-null}" \
            --argjson cost      "${COST:-null}" \
            --arg     model     "${MODEL:-}" \
            '{
              input_tokens: $input,
              output_tokens: $output,
              reasoning_tokens: $reasoning,
              cache_read_input_tokens: $cread,
              cache_creation_input_tokens: $ccreate,
              num_turns: $turns,
              cost_usd: $cost,
              model: (if $model == "" then null else $model end)
            }')

          LAST_MSG=$(printf '%s' "$EXPORT" | jq -r '
            [.messages[]? | select(.info.role == "assistant")] | last // empty |
            .parts | map(select(.type == "text")) | last // empty | .text // empty' 2>/dev/null)
        else
          METRICS_JSON="null"
          LAST_MSG=""
        fi

        {
          printf 'METRICS_JSON<<_AGENTS_EOF\n'
          printf '%s\n' "$METRICS_JSON"
          printf '_AGENTS_EOF\n'
        } >> "$GITHUB_ENV"

        if [ -n "$LAST_MSG" ]; then
          {
            printf 'LAST_MSG<<_AGENTS_EOF\n'
            printf '%s\n' "$LAST_MSG"
            printf '_AGENTS_EOF\n'
          } >> "$GITHUB_ENV"
        fi

        if [ -n "$SESSION_ID" ]; then
          echo "SESSION_ID=$SESSION_ID" >> "$GITHUB_ENV"
        fi

        if [ -n "${MODEL:-}" ]; then
          echo "AGENT_MODEL=$MODEL" >> "$GITHUB_ENV"
        fi

    - name: Write agent result to metadata folder
      if: always()
      shell: bash
      run: |
        if [ -n "${DEV_AGENTS_RESULTS_DIR:-}" ]; then
          mkdir -p "$DEV_AGENTS_RESULTS_DIR/metadata/agent"
          jq -nc \
            --arg name "opencode" \
            --arg sessionId "${SESSION_ID:-}" \
            --arg finalMessage "${LAST_MSG:-}" \
            --argjson metrics "${METRICS_JSON:-null}" \
            '{name: $name, sessionId: (if $sessionId == "" then null else $sessionId end), finalMessage: (if $finalMessage == "" then null else $finalMessage end), metrics: $metrics}' \
            > "$DEV_AGENTS_RESULTS_DIR/metadata/agent/data.json"
        fi

    - uses: developing-software/agents/actions/artifact/upload@dev
      if: always()
      with:
        path: ${{ runner.temp }}/opencode-session.json
        name: opencode_session.json
