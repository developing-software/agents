name: Write Check Result
description: Write a check result to the agents results folder

inputs:
  category:
    description: "Result category (e.g. tests, lint)"
    required: true
  name:
    description: "Check name (e.g. unit, oxlint, typecheck)"
    required: true
  outcome:
    description: "Check outcome: success or failure"
    required: true
  output:
    description: "Optional path to output file to copy into the results folder"
    required: false

runs:
  using: composite
  steps:
    - name: Write result
      if: always()
      shell: bash
      env:
        CATEGORY: ${{ inputs.category }}
        CHECK_NAME: ${{ inputs.name }}
        OUTCOME: ${{ inputs.outcome }}
        OUTPUT_PATH: ${{ inputs.output }}
      run: |
        if [ -z "${AGENTS_RESULTS_DIR:-}" ]; then
          exit 0
        fi
        mkdir -p "$AGENTS_RESULTS_DIR/$CATEGORY/$CHECK_NAME"
        printf '{"outcome":"%s"}\n' "$OUTCOME" > "$AGENTS_RESULTS_DIR/$CATEGORY/$CHECK_NAME/result.json"
        if [ -n "$OUTPUT_PATH" ] && [ -f "$OUTPUT_PATH" ]; then
          cp "$OUTPUT_PATH" "$AGENTS_RESULTS_DIR/$CATEGORY/$CHECK_NAME/output.txt"
        fi

    - name: Update issue comment
      if: always() && env.AGENTS_COMMENT_ID
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Scan results dir for all check outcomes (skip agent/)
        table="| Check | Status |\n|-------|--------|\n"
        for cat_dir in "$AGENTS_RESULTS_DIR"/*/; do
          cat_name=$(basename "$cat_dir")
          [ "$cat_name" = "agent" ] && continue
          for name_dir in "$cat_dir"*/; do
            [ -d "$name_dir" ] || continue
            check_name=$(basename "$name_dir")
            result_file="$name_dir/result.json"
            if [ -f "$result_file" ]; then
              outcome=$(grep -o '"outcome":"[^"]*"' "$result_file" | cut -d'"' -f4)
              case "$outcome" in
                success) icon="✅" ;;
                failure) icon="❌" ;;
                *)       icon="·"  ;;
              esac
              table+="| ${cat_name}/${check_name} | ${icon} ${outcome} |\n"
            fi
          done
        done

        harness="${AGENTS_HARNESS:-agent}"
        body=$(printf '%s\n' \
          "> **Agent workflow in progress**" \
          ">" \
          "> **Run:** [View workflow run](${AGENTS_RUN_URL})" \
          "> **Branch:** \`${AGENTS_BRANCH}\`" \
          "> **Agent:** ${harness}" \
          ">" \
          "$(printf "$table")")

        gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${AGENTS_COMMENT_ID}" \
          -X PATCH -f body="$body" --silent || echo "::warning::Failed to update issue comment"
