name: Collect Codex Agent Data
description: Capture result from openai/codex-action and emit result event with metrics from persisted session data

inputs:
  final_message:
    description: Final message output from openai/codex-action
    required: false
  token:
    description: Personal access token for posting events to the Agents API
    required: false
  url:
    description: Agents API base URL
    required: false
    default: https://api.agents.developing.company/api

runs:
  using: composite
  steps:
    - name: Capture token usage
      if: always()
      shell: bash
      run: |
        # Find the most recent Codex session JSONL
        ROLLOUT=$(find ~/.codex/sessions -name 'rollout-*.jsonl' -type f -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2)

        if [ -n "$ROLLOUT" ] && [ -f "$ROLLOUT" ]; then
          # Copy session file for artifact upload
          cp "$ROLLOUT" "${RUNNER_TEMP:-/tmp}/codex-session.jsonl"

          # Get the last token_count event (cumulative totals)
          TOKENS=$(jq -sc '[.[] | select(.type == "event_msg" and .payload.type == "token_count" and .payload.info != null) | .payload.info.total_token_usage] | if length == 0 then null else last end' "$ROLLOUT" 2>/dev/null)

          if [ -n "$TOKENS" ] && [ "$TOKENS" != "null" ]; then
            INPUT=$(printf '%s' "$TOKENS"      | jq -r '.input_tokens // empty')
            OUTPUT=$(printf '%s' "$TOKENS"     | jq -r '.output_tokens // empty')
            REASONING=$(printf '%s' "$TOKENS"  | jq -r '.reasoning_output_tokens // empty')
            CACHE_READ=$(printf '%s' "$TOKENS" | jq -r '.cached_input_tokens // empty')
          fi

          # Get model from last turn_context event
          MODEL=$(jq -r 'select(.type == "turn_context") | .payload.model // empty' "$ROLLOUT" 2>/dev/null | tail -1)

          # Count turns
          NUM_TURNS=$(jq -sc '[.[] | select(.type == "turn_context")] | length' "$ROLLOUT" 2>/dev/null)
          [ "$NUM_TURNS" = "0" ] && NUM_TURNS=""
        fi

        METRICS_JSON=$(jq -nc \
          --argjson input     "${INPUT:-null}" \
          --argjson output    "${OUTPUT:-null}" \
          --argjson reasoning "${REASONING:-null}" \
          --argjson cread     "${CACHE_READ:-null}" \
          --argjson turns     "${NUM_TURNS:-null}" \
          --arg     model     "${MODEL:-}" \
          '{
            input_tokens: $input,
            output_tokens: $output,
            reasoning_tokens: $reasoning,
            cache_read_input_tokens: $cread,
            cache_creation_input_tokens: null,
            num_turns: $turns,
            cost_usd: null,
            model: (if $model == "" then null else $model end)
          }')

        {
          printf 'METRICS_JSON<<_AGENTS_EOF\n'
          printf '%s\n' "$METRICS_JSON"
          printf '_AGENTS_EOF\n'
        } >> "$GITHUB_ENV"

    - name: Write agent result to results folder
      if: always()
      shell: bash
      env:
        FINAL_MESSAGE: ${{ inputs.final_message }}
      run: |
        if [ -n "${AGENTS_RESULTS_DIR:-}" ]; then
          mkdir -p "$AGENTS_RESULTS_DIR/agent"
          jq -nc \
            --arg agent "codex" \
            --arg finalMessage "${FINAL_MESSAGE:-}" \
            --argjson metrics "${METRICS_JSON:-null}" \
            '{agent: $agent, sessionId: null, finalMessage: (if $finalMessage == "" then null else $finalMessage end), metrics: $metrics}' \
            > "$AGENTS_RESULTS_DIR/agent/result.json"
        fi

    - uses: developing-software/agents/actions/event/emit@dev
      if: always() && inputs.token != ''

      with:
        token: ${{ inputs.token }}
        url: ${{ inputs.url }}
        event_id_env: CODEX_EVENT_ID
        type: agent.result
        data: >-
          {"agent":"codex","finalMessage":${{ toJSON(inputs.final_message) }},"sessionId":null,"metrics":${{ env.METRICS_JSON || 'null' }}}

    - uses: developing-software/agents/actions/artifact/upload@dev
      if: always() && inputs.token != ''
      with:
        token: ${{ inputs.token }}
        url: ${{ inputs.url }}
        path: ${{ runner.temp }}/codex-session.jsonl
        name: codex_session.jsonl
