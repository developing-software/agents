name: Create Pull Request
description: Create a pull request and write PR metadata to the results folder

inputs:
  title:
    description: "PR title (auto-generates from prefix + issue if not provided)"
    required: false
  body:
    description: "PR body (auto-generates if not provided)"
    required: false
  base_branch:
    description: "Base branch (default: repo default branch)"
    required: false
  prefix:
    description: "Branch prefix for auto-generated title (e.g. claude)"
    required: false
  issue_number:
    description: "Issue number for auto-generated title/body"
    required: false
  prompt:
    description: "Original prompt/task given to the agent"
    required: false
  model:
    description: "Model used by the agent"
    required: false

outputs:
  pr_url:
    description: Created PR URL
    value: ${{ steps.create.outputs.pr_url }}
  pr_number:
    description: PR number
    value: ${{ steps.create.outputs.pr_number }}

runs:
  using: composite
  steps:
    - name: Create PR
      id: create
      shell: bash
      env:
        PR_TITLE: ${{ inputs.title }}
        PR_BODY: ${{ inputs.body }}
        BASE_BRANCH: ${{ inputs.base_branch }}
        PREFIX: ${{ inputs.prefix }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        PROMPT: ${{ inputs.prompt }}
        MODEL: ${{ inputs.model }}
        GH_TOKEN: ${{ github.token }}
      run: |
        BRANCH="${DEV_AGENTS_BRANCH:-$(git branch --show-current)}"
        RUN_ID="${GITHUB_RUN_ID}"
        RUN_URL="${DEV_AGENTS_RUN_URL:-https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}}"
        PREFIX_LABEL="${PREFIX:-agent}"
        AGENT_LABEL="$(echo "${PREFIX_LABEL:0:1}" | tr '[:lower:]' '[:upper:]')${PREFIX_LABEL:1}"

        # Resolve base branch
        if [ -z "$BASE_BRANCH" ]; then
          BASE_BRANCH=$(gh repo view --json defaultBranchRef -q '.defaultBranchRef.name' 2>/dev/null || echo "main")
        fi

        # Fetch issue title if linked
        ISSUE_TITLE=""
        if [ -n "$ISSUE_NUMBER" ]; then
          ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" --json title -q '.title' 2>/dev/null || true)
        fi

        # Auto-generate title
        if [ -z "$PR_TITLE" ]; then
          if [ -n "$ISSUE_TITLE" ]; then
            PR_TITLE="${AGENT_LABEL}: ${ISSUE_TITLE}"
          elif [ -n "$ISSUE_NUMBER" ]; then
            PR_TITLE="${AGENT_LABEL}: #${ISSUE_NUMBER}"
          elif [ -n "$PROMPT" ]; then
            # Use first line of prompt, truncated
            FIRST_LINE=$(echo "$PROMPT" | head -1 | sed 's/^[[:space:]]*//')
            if [ ${#FIRST_LINE} -gt 60 ]; then
              FIRST_LINE="${FIRST_LINE:0:57}..."
            fi
            PR_TITLE="${AGENT_LABEL}: ${FIRST_LINE}"
          else
            PR_TITLE="${AGENT_LABEL}: run-${RUN_ID}"
          fi
        fi

        # Auto-generate body
        if [ -z "$PR_BODY" ]; then
          PR_BODY=""

          # Link to issue
          if [ -n "$ISSUE_NUMBER" ]; then
            PR_BODY="Closes #${ISSUE_NUMBER}"$'\n\n'
          fi

          # Task section
          if [ -n "$PROMPT" ]; then
            # Truncate very long prompts
            TASK_TEXT="$PROMPT"
            if [ ${#TASK_TEXT} -gt 2000 ]; then
              TASK_TEXT="${TASK_TEXT:0:2000}..."
            fi
            PR_BODY="${PR_BODY}## Task"$'\n\n'
            PR_BODY="${PR_BODY}${TASK_TEXT}"$'\n\n'
          fi

          # Changes section — file-level diff summary
          git fetch origin "$BASE_BRANCH" --depth=1 2>/dev/null || true
          DIFF_STAT=$(git diff "origin/${BASE_BRANCH}..HEAD" --stat 2>/dev/null || true)
          if [ -n "$DIFF_STAT" ]; then
            PR_BODY="${PR_BODY}## Changes"$'\n\n'
            PR_BODY="${PR_BODY}\`\`\`"$'\n'
            PR_BODY="${PR_BODY}${DIFF_STAT}"$'\n'
            PR_BODY="${PR_BODY}\`\`\`"$'\n\n'
          fi

          # Footer
          FOOTER="---"$'\n'
          FOOTER="${FOOTER}Generated by [${AGENT_LABEL}](${RUN_URL})"
          if [ -n "$MODEL" ]; then
            FOOTER="${FOOTER} · \`${MODEL}\`"
          fi
          PR_BODY="${PR_BODY}${FOOTER}"
        fi

        # Create PR (idempotent)
        PR_URL=""
        if ! PR_URL=$(gh pr create --title "$PR_TITLE" --body "$PR_BODY" --base "$BASE_BRANCH" --head "$BRANCH" 2>/dev/null); then
          # Check if PR already exists
          PR_URL=$(gh pr list --head "$BRANCH" --json url -q '.[0].url' 2>/dev/null || true)
          if [ -n "$PR_URL" ]; then
            echo "::notice::PR already exists: $PR_URL"
          else
            echo "::warning::PR creation failed and no existing PR found"
          fi
        fi

        PR_NUMBER=$(echo "$PR_URL" | grep -oP '/pull/\K\d+' || true)

        {
          echo "pr_url=${PR_URL}"
          echo "pr_number=${PR_NUMBER}"
        } >> "$GITHUB_OUTPUT"

        # Write PR tag
        if [ -n "${DEV_AGENTS_TAGS_DIR:-}" ] && [ -n "$PR_NUMBER" ]; then
          printf 'gh:pr:%s\n' "$PR_NUMBER" > "$DEV_AGENTS_TAGS_DIR/gh-pr"
        fi

        # Write PR metadata
        if [ -n "${DEV_AGENTS_RESULTS_DIR:-}" ] && [ -n "$PR_URL" ]; then
          mkdir -p "$DEV_AGENTS_RESULTS_DIR/pr"
          jq -nc --arg url "$PR_URL" --arg num "${PR_NUMBER:-}" \
            '{url: $url, number: (if $num == "" then null else ($num | tonumber) end)}' \
            > "$DEV_AGENTS_RESULTS_DIR/pr/data.json"
        fi
