name: Create Issue Comment
description: Post a comment on a GitHub issue and export the comment ID

inputs:
  issue_number:
    description: "Issue number to comment on"
    required: true
  body:
    description: "Comment body (auto-generates a progress comment if not provided)"
    required: false

outputs:
  comment_id:
    description: Created comment ID
    value: ${{ steps.post.outputs.comment_id }}

runs:
  using: composite
  steps:
    - name: Post comment
      id: post
      shell: bash
      env:
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        COMMENT_BODY: ${{ inputs.body }}
        GH_TOKEN: ${{ github.token }}
      run: |
        RUN_URL="${DEV_AGENTS_RUN_URL:-https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}}"
        BRANCH="${DEV_AGENTS_BRANCH:-}"
        HARNESS="${DEV_AGENTS_HARNESS:-}"

        # Auto-generate body if not provided
        if [ -z "$COMMENT_BODY" ]; then
          LINES=()
          LINES+=("> **Workflow started**")
          LINES+=(">")
          LINES+=("> **Run:** [View workflow run](${RUN_URL})")
          [ -n "$BRANCH" ] && LINES+=("> **Branch:** \`${BRANCH}\`")
          [ -n "$HARNESS" ] && LINES+=("> **Agent:** ${HARNESS}")
          LINES+=(">")
          LINES+=("> _In progress..._")
          COMMENT_BODY=$(printf '%s\n' "${LINES[@]}")
        fi

        COMMENT_URL=$(gh issue comment "$ISSUE_NUMBER" \
          --repo "$GITHUB_REPOSITORY" \
          --body "$COMMENT_BODY" 2>&1)

        COMMENT_ID=$(echo "$COMMENT_URL" | grep -oP '#issuecomment-\K\d+' || true)

        if [ -n "$COMMENT_ID" ]; then
          echo "comment_id=$COMMENT_ID" >> "$GITHUB_OUTPUT"
          echo "DEV_AGENTS_COMMENT_ID=$COMMENT_ID" >> "$GITHUB_ENV"
        else
          echo "::warning::Could not extract comment ID from: $COMMENT_URL"
        fi
