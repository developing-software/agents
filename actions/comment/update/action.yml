name: Update Issue Comment
description: Update an existing issue comment with status information

inputs:
  body:
    description: "Comment body (auto-generates from results dir if not provided)"
    required: false

runs:
  using: composite
  steps:
    - name: Update comment
      if: always() && env.DEV_AGENTS_COMMENT_ID
      shell: bash
      env:
        COMMENT_BODY: ${{ inputs.body }}
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -n "$COMMENT_BODY" ]; then
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${DEV_AGENTS_COMMENT_ID}" \
            -X PATCH -f body="$COMMENT_BODY" --silent || echo "::warning::Failed to update issue comment"
          exit 0
        fi

        # Auto-generate body from results dir
        RUN_URL="${DEV_AGENTS_RUN_URL:-}"
        BRANCH="${DEV_AGENTS_BRANCH:-}"
        HARNESS="${DEV_AGENTS_HARNESS:-agent}"

        LINES=()
        LINES+=("> **Workflow completed**")
        LINES+=(">")
        LINES+=("> **Run:** [View workflow run](${RUN_URL})")
        [ -n "$BRANCH" ] && LINES+=("> **Branch:** \`${BRANCH}\`")
        LINES+=("> **Agent:** ${HARNESS}")

        # Read PR data
        PR_FILE="${DEV_AGENTS_RESULTS_DIR:-}/pr/data.json"
        if [ -n "${DEV_AGENTS_RESULTS_DIR:-}" ] && [ -f "$PR_FILE" ]; then
          PR_URL=$(jq -r '.url // empty' "$PR_FILE")
          [ -n "$PR_URL" ] && LINES+=("> **PR:** ${PR_URL}")
        fi

        # Read diff data
        DIFF_FILE="${DEV_AGENTS_RESULTS_DIR:-}/diff/data.json"
        if [ -n "${DEV_AGENTS_RESULTS_DIR:-}" ] && [ -f "$DIFF_FILE" ]; then
          ADDED=$(jq -r '.linesAdded // 0' "$DIFF_FILE")
          REMOVED=$(jq -r '.linesRemoved // 0' "$DIFF_FILE")
          LINES+=("> **Lines:** +${ADDED} / -${REMOVED}")
        fi

        # Scan checks dir for check outcomes
        if [ -n "${DEV_AGENTS_RESULTS_DIR:-}" ] && [ -d "$DEV_AGENTS_RESULTS_DIR/checks" ]; then
          CHECK_LINES=()
          for cat_dir in "$DEV_AGENTS_RESULTS_DIR/checks"/*/; do
            [ -d "$cat_dir" ] || continue
            cat_name=$(basename "$cat_dir")
            for name_dir in "$cat_dir"*/; do
              [ -d "$name_dir" ] || continue
              check_name=$(basename "$name_dir")
              data_file="$name_dir/data.json"
              if [ -f "$data_file" ]; then
                outcome=$(jq -r '.outcome // "unknown"' "$data_file")
                CHECK_LINES+=("> - **${cat_name}/${check_name}:** ${outcome}")
              fi
            done
          done
          if [ ${#CHECK_LINES[@]} -gt 0 ]; then
            LINES+=(">")
            LINES+=("${CHECK_LINES[@]}")
          fi
        fi

        BODY=$(printf '%s\n' "${LINES[@]}")

        gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${DEV_AGENTS_COMMENT_ID}" \
          -X PATCH -f body="$BODY" --silent || echo "::warning::Failed to update issue comment"
